<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Munchies · Tienda Escolar</title>
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="Munchies NAS">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B3A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/galleta-180.png">
<style>
:root{
  /* Marca NAS */
  --navy:#1B3A6B; --navy-deep:#112850; --navy-light:#2c5290;
  --red:#C8292B; --red-deep:#9c1d1f;
  --gold:#F5C842; --gold-light:#FFDE7A; --gold-deep:#8a6400;
  --green:#2D8C4E;
  /* Superficies y texto (semánticos, cambian en modo oscuro) */
  --bg:#FFF8E6; --surface:#ffffff; --surface-2:#F4EFE0; --ink:#1b2233; --muted:#566074;
  --line:rgba(27,58,107,0.12); --title:#1B3A6B; --on-navy:#ffffff;
  --scrim:rgba(10,22,45,0.6);
  --pending:#8f4f00; --pending-bg:#fdecd2;
  --ready:#1f5fa6;   --ready-bg:#e6effb;
  --delivered:#1f7a43; --delivered-bg:#e0f3e7;
  /* Estados (semáforo) */
  --pay-ok:#17693a;   --pay-ok-bg:#dcf2e4;
  --pay-debe:#b01e22; --pay-debe-bg:#fde3e3;
  --del-done:#1a559b; --del-done-bg:#e1ecfa;
  --del-wait:#7d5600; --del-wait-bg:#fdf0c8;
  --dot-debe:#e0393c; --dot-wait:#f0a51e; --dot-done:#2D8C4E;
  --weekend-bg:#e6e4dc; --weekend-fg:#6f7685;
  --shadow: 0 10px 28px rgba(27,58,107,0.18);
  --shadow-sm: 0 2px 10px rgba(27,58,107,0.10);
  --ring: 0 0 0 3px rgba(27,58,107,0.35);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c1426; --surface:#16213a; --surface-2:#1e2c4a; --ink:#eef2fb; --muted:#a8b3c9;
    --line:rgba(255,255,255,0.12); --title:#dce7ff;
    --scrim:rgba(0,0,0,0.65);
    --pending:#ffc27a; --pending-bg:rgba(240,165,30,0.16);
    --ready:#9cc4f5; --ready-bg:rgba(60,120,200,0.2);
    --delivered:#86e0a6; --delivered-bg:rgba(45,140,78,0.22);
    --pay-ok:#86e0a6;   --pay-ok-bg:rgba(45,140,78,0.24);
    --pay-debe:#ff9b9d; --pay-debe-bg:rgba(200,41,43,0.26);
    --del-done:#a5c9f7; --del-done-bg:rgba(60,120,200,0.24);
    --del-wait:#ffd978; --del-wait-bg:rgba(245,200,66,0.18);
    --weekend-bg:#1a2338; --weekend-fg:#7d889e;
    --shadow: 0 10px 28px rgba(0,0,0,0.45);
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.35);
    --ring: 0 0 0 3px rgba(255,222,122,0.6);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family: -apple-system,BlinkMacSystemFont,'SF Pro Rounded','SF Pro Display','Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif;
  background: var(--bg); color: var(--ink); color-scheme: light dark;
  overscroll-behavior-y: none; min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.3;
}
#app{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:104px; }
button{font-family:inherit; cursor:pointer; touch-action:manipulation;}
[data-act]{touch-action:manipulation;}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; box-shadow:var(--ring); border-radius:inherit;}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

/* ---- Sync banner ---- */
.sync-banner{max-width:480px; margin:0 auto; background:#fff1c2; color:#6b4e00; font-size:12.5px; font-weight:700;
  padding:9px 16px; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(138,100,0,0.25);}
@media (prefers-color-scheme: dark){ .sync-banner{background:#3a2f0c; color:#ffe08a;} }
.sync-banner svg{width:16px;height:16px;flex-shrink:0;}
.sync-banner.hidden{display:none;}

/* ---- Top bar (con toldo de tienda) ---- */
.topbar{
  background: linear-gradient(165deg, var(--navy-light) 0%, var(--navy) 45%, var(--navy-deep) 100%);
  color: #fff; padding: max(16px, env(safe-area-inset-top)) 18px 30px;
  border-radius: 0 0 30px 30px; position:relative; overflow:hidden; box-shadow:var(--shadow);
}
.topbar::before{ content:""; position:absolute; left:0; right:0; bottom:0; height:9px;
  background: repeating-linear-gradient(90deg, var(--red) 0 22px, #fff8e6 22px 44px); opacity:.95; }
.topbar::after{ content:""; position:absolute; right:-40px; top:-40px; width:180px; height:180px;
  background: radial-gradient(circle, rgba(245,200,66,0.32), transparent 70%); border-radius:50%; pointer-events:none; }
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; z-index:1;}
.brand{display:flex; align-items:center; gap:12px; min-width:0;}
.brand-logo{width:88px;height:88px; object-fit:contain; flex-shrink:0; display:block; filter:drop-shadow(0 3px 7px rgba(0,0,0,0.35));}
.brand-text h1{font-size:22px; font-weight:900; margin:0; letter-spacing:0.2px; color:#fff;}
.brand-text p{font-size:12px; margin:2px 0 0; color:rgba(255,255,255,0.8); letter-spacing:0.2px;}
.sync-pill{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:#fff;
  background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.25); padding:7px 11px; border-radius:20px;}
.sync-pill .dot-live{width:9px;height:9px;border-radius:50%; background:#5be08c; box-shadow:0 0 0 0 rgba(91,224,140,0.7); animation:pulse 2s infinite;}
.sync-pill.local .dot-live{background:var(--gold); animation:none; box-shadow:none;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,224,140,0.6)}70%{box-shadow:0 0 0 7px rgba(91,224,140,0)}100%{box-shadow:0 0 0 0 rgba(91,224,140,0)}}

.summary-row{display:flex; gap:10px; margin-top:18px; position:relative; z-index:1;}
.summary-card{flex:1; min-width:0; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.22); border-radius:16px; padding:11px 12px;}
.summary-card .num{font-size:22px; font-weight:900; color:var(--gold-light); line-height:1.1;}
.summary-card .num.small{font-size:17px; padding-top:3px;}
.summary-card .lbl{font-size:11.5px; color:rgba(255,255,255,0.88); margin-top:3px; font-weight:600;}

/* ---- Selector de productos: chips deslizables con scroll-snap ---- */
.product-wrap{position:relative; max-width:480px; margin:0 auto;}
.product-wrap::after{content:""; position:absolute; top:0; right:0; bottom:0; width:44px; pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--bg) 85%); transition:opacity .2s;}
.product-wrap.at-end::after{opacity:0;}
.product-switch{display:flex; gap:10px; padding:14px 16px 8px; overflow-x:auto; scrollbar-width:none;
  scroll-snap-type:x proximity; scroll-padding:0 16px; -webkit-overflow-scrolling:touch;}
.product-switch::-webkit-scrollbar{display:none;}
.prod-btn{flex:0 0 auto; scroll-snap-align:start; min-height:56px; display:flex; align-items:center; gap:9px; padding:6px 16px 6px 7px;
  border-radius:20px; border:2px solid var(--line); background:var(--surface); color:var(--title); text-align:left;
  box-shadow:var(--shadow-sm); transition:transform .12s, background .15s, border-color .15s;}
.prod-ico{width:42px;height:42px;border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.prod-ico img,.prod-ico svg{width:34px;height:34px; object-fit:contain; display:block;}
.prod-txt{display:flex; flex-direction:column; align-items:flex-start; gap:1px;}
.prod-label{font-size:15px; font-weight:800; white-space:nowrap; line-height:1.15;}
.prod-sub{font-size:11.5px; font-weight:600; color:var(--muted); white-space:nowrap; line-height:1.15;}
.prod-btn.active{background:var(--navy); border-color:var(--gold); color:#fff; box-shadow:0 0 0 3px rgba(245,200,66,0.35), var(--shadow-sm);}
.prod-btn.active .prod-ico{background:#fff;}
.prod-btn.active .prod-sub{color:rgba(255,255,255,0.85);}
.prod-btn.active .prod-label::after{content:" ✓"; color:var(--gold-light);}
.prod-btn:active{transform:scale(0.96);}

/* ---- Calendar ---- */
.cal-wrap{padding: 14px 16px 8px;}
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 2px;}
.cal-nav button{width:44px;height:44px;border-radius:50%;border:none;background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); transition:transform .12s;}
.cal-nav button:active{transform:scale(0.92);}
.cal-nav button svg{width:20px;height:20px;}
.cal-nav .cal-title{font-size:19px; font-weight:900; color:var(--title); text-transform:capitalize;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{text-align:center; font-size:12px; font-weight:800; color:var(--muted); padding-bottom:4px;}
.cal-day{aspect-ratio:1; min-height:44px; border-radius:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:var(--surface); border:1px solid var(--line); font-size:15px; font-weight:700; color:var(--ink); position:relative; box-shadow:var(--shadow-sm); transition:transform .1s;}
.cal-day[data-date]{cursor:pointer;}
.cal-day[data-date]:active{transform:scale(0.92);}
.cal-day.empty{background:transparent; border:none; box-shadow:none;}
.cal-day.today{border:2.5px solid var(--gold); box-shadow:0 0 0 2px rgba(245,200,66,0.3), var(--shadow-sm); font-weight:900;}
.cal-day.has-orders{background:var(--navy); color:#fff; border-color:var(--navy);}
.cal-day.has-orders.today{border-color:var(--gold);}
.cal-day.festivo{background:var(--red-deep); color:rgba(255,255,255,0.88); border:1px solid rgba(0,0,0,0.1); cursor:default; box-shadow:none;}
.cal-day.festivo.has-orders{background:var(--red-deep);}
.cal-day.weekend{background:var(--weekend-bg); color:var(--weekend-fg); border:1px solid transparent; cursor:default; box-shadow:none; font-weight:600;}
.cal-day.weekend.has-orders{background:var(--weekend-bg);}
.dot-row{display:flex; gap:3px;}
.dot{width:7px;height:7px;border-radius:50%; box-shadow:0 0 0 1.5px rgba(255,255,255,0.9);}
.dot.pending{background:var(--dot-debe);}
.dot.ready{background:var(--dot-wait);}
.dot.delivered{background:#4fd07f;}
.cal-legend{display:flex; gap:8px 14px; justify-content:center; flex-wrap:wrap; margin-top:16px; padding:12px; background:var(--surface); border-radius:16px; border:1px solid var(--line);}
.legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:700;}
.legend-dot{width:10px;height:10px;border-radius:50%; display:inline-block;}
.legend-sq{width:11px;height:11px;border-radius:4px; display:inline-block;}
.legend-festivo{background:var(--red-deep);}
.legend-weekend{background:var(--weekend-bg); border:1px solid var(--line);}

/* ---- Section / headers ---- */
.day-view{padding:6px 16px 20px;}
.view-title{font-size:25px; font-weight:900; color:var(--title); margin:14px 2px 12px; letter-spacing:-0.2px;}
.day-header{display:flex; align-items:center; justify-content:space-between; margin:8px 0 4px;}
.back-btn{display:flex; align-items:center; gap:4px; min-height:44px; color:var(--title); font-weight:800; font-size:15px; background:none; border:none; padding:0 8px 0 0;}
.back-btn svg{width:20px;height:20px;}
.day-title{font-size:23px; font-weight:900; color:var(--title); text-transform:lowercase; letter-spacing:-0.2px;}
.day-title::first-letter{text-transform:uppercase;}
.add-order-btn{width:100%; min-height:58px; padding:16px; border-radius:20px; border:none; background:linear-gradient(135deg,var(--red) 0%, var(--red-deep) 100%); color:#fff; font-size:17px; font-weight:900; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 8px 20px rgba(200,41,43,0.35); margin-bottom:8px; transition:transform .12s;}
.add-order-btn svg{width:22px;height:22px;}
.add-order-btn:active{transform:scale(0.97);}
.section-label{font-size:13px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:0.7px; margin:22px 0 10px 2px;}

/* ---- Order card ---- */
.order-card{background:var(--surface); border-radius:20px; padding:13px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; border:1px solid var(--line); box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .1s;}
.order-card:active{transform:scale(0.985);}
.order-card.is-delivered{opacity:0.75;}
.order-avatar{width:46px;height:46px;border-radius:50%; flex-shrink:0; background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px;}
.order-avatar.teacher{background:var(--red); color:#fff;}
.order-info{flex:1; min-width:0;}
.order-name{font-size:16px; font-weight:800; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.order-meta{font-size:13px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.qty-badge{font-size:13px; font-weight:900; color:var(--navy); background:var(--gold); padding:1px 9px; border-radius:10px;}
.order-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0;}
.status-chip{padding:5px 11px; border-radius:11px; font-size:12px; font-weight:800; display:flex; align-items:center; gap:4px; white-space:nowrap;}
.status-chip svg{width:12px;height:12px;}

/* chips de estado (pago + entrega, independientes) */
.chip{display:inline-flex; align-items:center; justify-content:center; gap:5px; min-height:38px; padding:6px 12px; border-radius:12px; font-size:12.5px; font-weight:800; white-space:nowrap; border:1.5px solid transparent; cursor:pointer; -webkit-appearance:none; appearance:none; line-height:1.1; transition:transform .1s;}
.chip:active{transform:scale(0.93);}
.chip svg{width:14px;height:14px;}
.chip-paid{background:var(--pay-ok-bg); color:var(--pay-ok); border-color:rgba(23,105,58,0.35);}
.chip-debe{background:var(--pay-debe-bg); color:var(--pay-debe); border-color:rgba(176,30,34,0.4);}
.chip-entregado{background:var(--del-done-bg); color:var(--del-done); border-color:rgba(26,85,155,0.35);}
.chip-porentregar{background:var(--del-wait-bg); color:var(--del-wait); border-color:rgba(125,86,0,0.4);}

/* franja de color a la izquierda */
.order-card.acc-wait,.chk-row.acc-wait{box-shadow: inset 6px 0 0 var(--dot-wait), var(--shadow-sm);}
.order-card.acc-debe,.chk-row.acc-debe{box-shadow: inset 6px 0 0 var(--dot-debe), var(--shadow-sm);}
.order-card.acc-done,.chk-row.acc-done{box-shadow: inset 6px 0 0 var(--dot-done), var(--shadow-sm);}
.order-card.acc-wait,.order-card.acc-debe,.order-card.acc-done{padding-left:20px;}

/* ---- Delivery queue ---- */
.deliver-toggle{display:flex; gap:8px; margin:2px 0 14px;}
.deliver-toggle .filter-chip{flex:1;}
.deliver-card{background:var(--surface); border-radius:18px; padding:14px; margin-bottom:12px; border:1px solid var(--line); box-shadow:var(--shadow-sm);}
.date-group-label{font-size:14px; font-weight:900; color:var(--title); text-transform:capitalize; margin:18px 2px 10px; display:flex; align-items:center; gap:8px;}
.date-group-label .pill{font-size:12px; font-weight:800; color:var(--navy); background:var(--gold); border-radius:20px; padding:3px 10px;}

.deliver-hint{font-size:13.5px; color:var(--muted); line-height:1.45; margin:0 2px 14px; padding:11px 14px; background:var(--surface); border-radius:14px; border:1px dashed var(--line);}
.deliver-hint b{color:var(--ink);}
.deliver-counts{display:flex; gap:18px; font-size:13.5px; font-weight:800; color:var(--title); margin:0 2px 12px;}
.deliver-counts span:first-child::before{content:"●"; color:var(--dot-wait); margin-right:6px;}
.deliver-counts span:last-child::before{content:"●"; color:var(--dot-done); margin-right:6px;}
.chk-row{display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:18px; padding:11px 13px 11px 19px; margin-bottom:10px; border:1px solid var(--line); box-shadow:var(--shadow-sm);}
.chk-row.is-delivered{opacity:0.75;}
.chkbox{width:48px;height:48px; flex-shrink:0; border-radius:14px; border:2.5px solid var(--navy-light); background:var(--surface); color:#fff; display:flex; align-items:center; justify-content:center; padding:0; transition:transform .1s;}
.chkbox:active{transform:scale(0.9);}
.chkbox svg{width:26px;height:26px;}
.chkbox.on{background:var(--green); border-color:var(--green);}
.chk-info{flex:1; min-width:0; cursor:pointer;}
.pay-tag{flex-shrink:0; min-height:44px; padding:8px 14px; border-radius:13px; font-size:13px; font-weight:800; white-space:nowrap; border:1.5px solid transparent; transition:transform .1s;}
.pay-tag:active{transform:scale(0.94);}
.pay-tag.paid{background:var(--pay-ok-bg); color:var(--pay-ok); border-color:rgba(23,105,58,0.35);}
.pay-tag.debe{background:var(--pay-debe-bg); color:var(--pay-debe); border-color:rgba(176,30,34,0.45);}

/* ---- Empty ---- */
.empty-state{text-align:center; padding:36px 20px; color:var(--muted); background:var(--surface); border-radius:22px; border:2px dashed var(--line);}
.empty-state .es-icon{width:76px;height:76px;margin:0 auto 12px; border-radius:50%; background:var(--surface-2); color:var(--navy-light); display:flex; align-items:center; justify-content:center;}
.empty-state .es-icon svg{width:40px;height:40px;}
.empty-state p{font-size:16px; margin:0; font-weight:800; color:var(--ink);}
.empty-state .es-sub{font-size:13.5px; margin-top:6px; font-weight:500; line-height:1.45;}

/* ---- Modal / sheet ---- */
.modal-overlay{position:fixed; inset:0; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; z-index:1000; opacity:0; pointer-events:none; transition:opacity 0.25s ease;}
.modal-overlay.show{opacity:1; pointer-events:auto;}
.sheet{background:var(--bg); width:100%; max-width:480px; border-radius:30px 30px 0 0; max-height:92vh; overflow-y:auto; transform:translateY(100%); transition:transform 0.32s cubic-bezier(0.32,0.72,0,1); padding-bottom:max(20px, env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,0.25);}
.modal-overlay.show .sheet{transform:translateY(0);}
.sheet-handle{width:44px; height:5px; background:var(--line); border-radius:3px; margin:10px auto 2px;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; padding:8px 20px 12px;}
.sheet-title{font-size:21px; font-weight:900; color:var(--title);}
.sheet-close{width:44px;height:44px;border-radius:50%; background:var(--surface-2); border:none; display:flex; align-items:center; justify-content:center; color:var(--title);}
.sheet-close svg{width:18px;height:18px;}
.sheet-body{padding:4px 20px 24px;}

.step-progress{display:flex; gap:6px; padding:0 20px 14px;}
.step-progress .seg{flex:1; height:6px; border-radius:3px; background:var(--line);}
.step-progress .seg.active{background:var(--gold);}
.step-progress .seg.done{background:var(--navy-light);}

.tab-row{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 12px; scrollbar-width:none; scroll-snap-type:x proximity;}
.tab-row::-webkit-scrollbar{display:none;}
.tab-chip{flex-shrink:0; min-height:44px; display:flex; align-items:center; padding:0 18px; border-radius:22px; border:2px solid var(--line); background:var(--surface); font-size:15px; font-weight:800; color:var(--title); white-space:nowrap; cursor:pointer; scroll-snap-align:start; transition:transform .1s;}
.tab-chip:active{transform:scale(0.95);}
.tab-chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}
.tab-chip.teacher-chip.active{background:var(--red); color:#fff; border-color:var(--red);}

.search-input{width:100%; min-height:48px; padding:12px 16px; border-radius:16px; border:2px solid var(--line); font-size:16px; margin-bottom:14px; background:var(--surface); color:var(--ink); font-family:inherit;}
.search-input::placeholder{color:var(--muted);}
.search-input:focus{outline:none; border-color:var(--gold); box-shadow:var(--ring);}

.person-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.person-card{background:var(--surface); border-radius:18px; padding:12px 6px; text-align:center; border:2px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; min-height:104px; transition:transform .1s;}
.person-card:active{transform:scale(0.95);}
.person-card.selected{border-color:var(--gold); background:var(--surface-2); box-shadow:0 0 0 3px rgba(245,200,66,0.55);}

.lock-logo{width:min(62vw,240px);height:min(62vw,240px); object-fit:contain; margin-bottom:22px; filter:drop-shadow(0 6px 16px rgba(0,0,0,0.42));}

.lock .lk-sub{font-size:15px; color:rgba(255,255,255,0.85); margin:6px 0 24px;}

.keypad{display:grid; grid-template-columns:repeat(3,76px); gap:14px;}
.key{width:76px;height:76px;border-radius:50%; border:1.5px solid rgba(255,255,255,0.28); background:rgba(255,255,255,0.12); color:#fff; font-size:30px; font-weight:700; display:flex; align-items:center; justify-content:center; user-select:none; transition:transform .1s, background .1s;}

#ver-tag{position:fixed; right:8px; bottom:4px; z-index:9999; font-size:10px; font-weight:700; color:var(--muted); opacity:.75; pointer-events:none; background:rgba(255,255,255,.7); padding:1px 6px; border-radius:8px;}

.dv-pay{width:100%; text-align:center; padding:3px 0; flex-shrink:0;}
/* v34: fila en 3 columnas: producto | niño+curso | columna derecha (check arriba, Pagado/Debe debajo, 14px de aire) */
.dv-row{display:grid; grid-template-columns:76px minmax(0,1fr) 78px; align-items:center; column-gap:12px; padding:12px 10px 12px 8px;}

function loadLocal(){
  try { const raw = localStorage.getItem(STORAGE_KEY); orders = raw ? JSON.parse(raw) : []; }
  catch(e){ orders = []; }
}
function saveLocal(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(orders)); } catch(e){} }

function uid(){ return 'o_' + Date.now() + '_' + Math.floor(Math.random()*10000); }

// ---- Persistencia unificada (nube o local) ----
function upsertOrder(o){
  const i = orders.findIndex(x => x.id === o.id);
  if(i >= 0) orders[i] = o; else orders.push(o);
  saveLocal();
  if(cloudOn && db){ db.ref('orders/' + o.id).set(o).catch(()=>{}); }
  render();
}
function deleteOrderById(id){
  orders = orders.filter(x => x.id !== id);
  saveLocal();
  if(cloudOn && db){ db.ref('orders/' + id).remove().catch(()=>{}); }
  render();
}

// ============ FIREBASE ============
function cloudConfigured(){
  return typeof FIREBASE_CONFIG !== 'undefined'
    && FIREBASE_CONFIG.databaseURL
    && FIREBASE_CONFIG.databaseURL.indexOf('TU_') === -1
    && typeof firebase !== 'undefined';
}
function initCloud(){
  if(!cloudConfigured()) return;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    cloudOn = true;
    db.ref('orders').on('value', (snap) => {
      const val = snap.val() || {};
      orders = Object.values(val);
      saveLocal();
      render();
    }, () => { /* error de lectura: seguimos con lo local */ });
  } catch(e) { cloudOn = false; db = null; }
}

function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  const a = parts[0][0] || '';
  const b = parts[1] ? parts[1][0] : '';
  return (a + b).toUpperCase();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function todayKey(){ const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }
function formatCOP(n){ return '$' + Math.round(n).toLocaleString('es-CO'); }
function personTypeLabel(o){ return o.personType === 'teacher' ? 'Docente' : (GRADE_LABELS[o.grade] + ' grado'); }

// Si se acabaron las aguitas, a esa unidad solo se le cobra el producto (se descuenta el valor de la aguita)
function sinAguaOf(o){ const d = PRODUCTS[o.product||'slushie']; return (d && d.aguaIncl) ? Math.max(0, Math.min(o.qty, o.sinAgua||0)) : 0; }
function orderTotal(o){ return o.qty * priceOf(o) - sinAguaOf(o) * AGUA_PRICE; }
// Pago parcial (abono): lo que ya entró y lo que aún se debe de un pedido
function abonoOf(o){ return o.paid ? 0 : Math.max(0, Math.min(orderTotal(o), o.abono||0)); }
function owedOf(o){ return o.paid ? 0 : Math.max(0, orderTotal(o) - abonoOf(o)); }
function paidOf(o){ return o.paid ? orderTotal(o) : abonoOf(o); }
function activePrice(){ return PRODUCTS[state.activeProduct].price; }

// ============ RENDER: CALENDAR ============
function renderCalendar(){
  const y = state.calYear, m = state.calMonth;
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayK = todayKey();

  let cells = '';
  for(let i=0;i<firstDay;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dk = dateKey(y,m,d);
    const dow = new Date(y, m, d).getDay();
    const stats = dayStats(dk);
    const isToday = dk === todayK;
    const hasOrders = stats.count > 0;
    const festivo = isFestivo(dk);
    const weekend = isWeekend(dow) && !festivo;
    const blocked = festivo || weekend;

    let classes = 'cal-day';
    if(isToday) classes += ' today';
    if(hasOrders) classes += ' has-orders';
    if(festivo) classes += ' festivo';
    else if(weekend) classes += ' weekend';

    cells += `
      <div class="${classes}" ${blocked ? '' : `data-date="${dk}" role="button" tabindex="0" aria-label="${d} de ${MONTH_NAMES[m]}${hasOrders?', '+stats.count+' pedidos':''}"`} ${festivo ? `title="${esc(festivoName(dk))}"` : ''}>
        <span>${d}</span>
        ${hasOrders ? `<div class="dot-row">
          ${stats.debe>0?'<div class="dot pending"></div>':''}
          ${stats.porEntregar>0?'<div class="dot ready"></div>':''}
          ${stats.done>0?'<div class="dot delivered"></div>':''}
        </div>` : ''}
      </div>`;
  }

  return `
  <div class="cal-wrap">
    <div class="cal-nav">
      <button data-act="prev-month" aria-label="Mes anterior">${ICONS.back}</button>
      <div class="cal-title">${MONTH_NAMES[m]} ${y}</div>
      <button data-act="next-month" aria-label="Mes siguiente" style="transform:rotate(180deg)">${ICONS.back}</button>
    </div>
    <div class="cal-grid">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="cal-legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--dot-debe)"></span>Debe</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--dot-wait)"></span>Por entregar</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--dot-done)"></span>Completo</div>
      <div class="legend-item"><span class="legend-sq legend-festivo"></span>Festivo</div>
      <div class="legend-item"><span class="legend-sq legend-weekend"></span>Fin de semana</div>
    </div>
  </div>`;
}

// Un solo listado ordenado por niño (sus pedidos juntos); pendientes primero, entregados abajo
function dvList(all){
  const PR = ['perro','combo_pop','pop','agua','botella','brownie','slushie'];
  const first = {};
  all.forEach(o => { const k = o.personId || o.personName; const t = o.createdAt||0; if(!(k in first) || t < first[k]) first[k] = t; });
  const sorted = all.slice().sort((a,b)=>
    (a.delivered?1:0)-(b.delivered?1:0) ||
    first[a.personId||a.personName] - first[b.personId||b.personName] ||
    String(a.personId||a.personName).localeCompare(String(b.personId||b.personName)) ||
    PR.indexOf(a.product||'slushie') - PR.indexOf(b.product||'slushie'));
  return sorted.map(dvRow).join('');
}

function renderDeliverView(){
  const tk = todayKey();
  let q = orders.slice();                      // TODOS los productos juntos
  if(state.deliverScope === 'today') q = q.filter(o => o.date === tk);
  const porEntregar = q.filter(o=>!o.delivered).length;
  const entregados = q.filter(o=>o.delivered).length;

  let content;
  if(!q.length){
    content = `<div class="empty-state"><div class="es-icon">${ICONS.truck}</div>
      <p>${state.deliverScope==='today'?'No hay pedidos hoy':'No hay pedidos'}</p>
      <div class="es-sub">Los pedidos que registre la asistente aparecen aquí para entregar.</div></div>`;
  } else if(state.deliverScope === 'all'){
    const byDate = {};
    q.forEach(o => { (byDate[o.date] = byDate[o.date] || []).push(o); });
    content = Object.keys(byDate).sort().reverse().map(dk => {
      const dObj = new Date(dk + 'T00:00:00');
      const lbl = dk===tk ? 'Hoy' : dObj.toLocaleDateString('es-CO',{weekday:'long', day:'numeric', month:'short'});
      const pend = byDate[dk].filter(o=>!o.delivered).length;
      return `<div class="date-group-label">${lbl} <span class="pill">${pend} por entregar</span></div>${dvList(byDate[dk])}`;
    }).join('');
  } else {
    content = dvList(q);
  }

  return `
  <div class="day-view dv">
    <div class="dv-title">Entregar</div>
    <div class="deliver-toggle">
      <div class="filter-chip ${state.deliverScope==='today'?'active':''}" data-act="deliver-scope" data-s="today">Hoy</div>
      <div class="filter-chip ${state.deliverScope==='all'?'active':''}" data-act="deliver-scope" data-s="all">Todos</div>
    </div>
    <div class="dv-summary">
      <div class="dv-sum pend"><b>${porEntregar}</b><span>por entregar</span></div>
      <div class="dv-sum done"><b>${entregados}</b><span>entregados</span></div>
    </div>
    ${content}
  </div>`;
}

// Tarjeta de pedido con fecha + etiquetas tocables (reutilizable en Pedidos y Resumen)
function orderCardDated(o){
  return `
    <div class="order-card ${accClass(o)} ${isDone(o)?'is-delivered':''}" data-act="open-order" data-id="${o.id}">
      <div class="order-avatar ${o.personType==='teacher'?'teacher':''}">${initials(o.personName)}</div>

        <div class="order-name">${esc(o.personName)}</div>

      </div>
      <div class="order-right">${payChip(o)}${delChip(o)}</div>
    </div>`;
}
function renderListView(){
  const match = {
    all: ()=>true,
    debe: o=>!o.paid,
    porentregar: o=>!o.delivered,
    done: o=>isDone(o),
  };
  const scoped = orders.filter(isProd);
  const filtered = scoped.filter(match[state.listFilter]||match.all)
    .slice().sort((a,b) => b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));

  const counts = {
    all: scoped.length,
    debe: scoped.filter(o=>!o.paid).length,
    porentregar: scoped.filter(o=>!o.delivered).length,
    done: scoped.filter(isDone).length,
  };

  // Organizado por curso: 1° a 5° y Docentes; dentro de cada curso, lo más reciente primero
  const courseKey = (o) => o.personType === 'teacher' ? 'teacher' : (o.grade || '?');
  const courseOrder = GRADES.concat(['teacher','?']);
  const rows = filtered.length ? courseOrder.map(k => {
      const g = filtered.filter(o => courseKey(o) === k);
      if(!g.length) return '';
      const lbl = k==='teacher' ? 'Docentes' : (k==='?' ? 'Otros' : GRADE_LABELS[k] + ' grado');
      const pend = g.filter(o=>!isDone(o)).length;
      return `<div class="date-group-label">${lbl} <span class="pill">${g.length} pedido${g.length===1?'':'s'}${pend?` · ${pend} pendiente${pend===1?'':'s'}`:''}</span></div>${g.map(orderCardDated).join('')}`;
    }).join('')
    : `<div class="empty-state"><div class="es-icon">${ICONS.list}</div><p>No hay pedidos aquí</p></div>`;

  const chip = (f,label) => `<div class="filter-chip ${state.listFilter===f?'active':''}" data-act="filter" data-f="${f}">${label}<span class="fc-n">${counts[f]}</span></div>`;

  return `
  <div class="day-view">
    <div class="view-title">Todos los pedidos</div>
    <div class="filter-row">
      ${chip('all','Todos')}
      ${chip('debe','Deben')}
      ${chip('porentregar','Por entregar')}
      ${chip('done','Completos')}
    </div>
    ${rows}
  </div>`;
}
function formatDateShort(dk){
  const d = new Date(dk + 'T00:00:00');
  return d.toLocaleDateString('es-CO', {day:'numeric', month:'short'});
}

// ============ RENDER: STATS (por mes) ============
function renderStatsView(){
  const y = state.statsYear, m = state.statsMonth;
  const prefix = `${y}-${pad(m+1)}`;
  const mo = orders.filter(o => o.date.startsWith(prefix) && isProd(o));
  const sumQ = (f) => mo.filter(f).reduce((s,o)=>s+o.qty,0);
  const sumMoney = (f) => mo.filter(f).reduce((s,o)=>s+orderTotal(o),0);

  const vendidos    = sumQ(()=>true);
  const recaudado   = mo.reduce((s,o)=>s+paidOf(o),0);
  const porCobrar   = mo.reduce((s,o)=>s+owedOf(o),0);
  const porEntregar = sumQ(o=>!o.delivered);
  const entregados  = sumQ(o=>o.delivered);

  const byDate = (a,b)=> a.date.localeCompare(b.date) || (a.createdAt||0)-(b.createdAt||0);
  const deben      = mo.filter(o=>!o.paid).sort(byDate);
  const pagoFalta  = mo.filter(o=>o.paid && !o.delivered).sort(byDate);
  const debenTotal = deben.reduce((s,o)=>s+owedOf(o),0);
  const pLabel = PRODUCTS[state.activeProduct].label;

  return `
  <div class="day-view">
    <div class="view-title">Resumen · ${pLabel}</div>
    <div class="cal-nav" style="margin-bottom:12px;">
      <button data-act="stats-prev-month" aria-label="Mes anterior">${ICONS.back}</button>
      <div class="cal-title">${MONTH_NAMES[m]} ${y}</div>
      <button data-act="stats-next-month" aria-label="Mes siguiente" style="transform:rotate(180deg)">${ICONS.back}</button>
    </div>

    <div class="section-label" style="margin-top:2px;">¿Cómo vamos este mes?</div>
    <div class="sv-grid">
      <div class="sv-card" style="border-color:rgba(31,122,67,0.28)"><div class="sv-num money" style="color:var(--pay-ok)">${formatCOP(recaudado)}</div><div class="sv-lbl">Recaudado</div></div>
      <div class="sv-card" style="border-color:rgba(198,32,38,0.28)"><div class="sv-num money" style="color:var(--pay-debe)">${formatCOP(porCobrar)}</div><div class="sv-lbl">Por cobrar</div></div>
      <div class="sv-card"><div class="sv-num">${vendidos}</div><div class="sv-lbl">${pLabel} vendidos</div></div>
      <div class="sv-card" style="border-color:rgba(179,128,26,0.28)"><div class="sv-num" style="color:var(--del-wait)">${porEntregar}</div><div class="sv-lbl">Por entregar</div></div>
    </div>

    <div class="section-label">Deben este mes${deben.length?` · ${formatCOP(debenTotal)}`:''}</div>
    ${deben.length ? deben.map(orderCardDated).join('')
      : `<div class="empty-state" style="padding:22px;"><p>¡Nadie debe este mes! 🎉</p></div>`}

    <div class="section-label">Pagaron, falta entregar</div>
    ${pagoFalta.length ? pagoFalta.map(orderCardDated).join('')
      : `<div class="empty-state" style="padding:22px;"><p>Todo lo pagado ya se entregó ✓</p></div>`}

    <div style="text-align:center; font-size:11px; color:var(--muted); margin:16px 0 2px;">${entregados} entregados este mes · precio ${formatCOP(activePrice())} c/u</div>
    <div style="text-align:center; font-size:11px; color:var(--muted); margin:4px 0 2px;">Versión ${APP_VERSION} · actualizado ${APP_UPDATED}</div>
  </div>`;
}

function renderProductSwitch(){

    ${Object.keys(PRODUCTS).map(p => `

      </button>`).join('')}

let _psScroll = 0;
function setupProductSwitch(){
  const sw = document.getElementById('product-switch'), wrap = document.getElementById('product-wrap');
  if(!sw || !wrap) return;
  const upd = () => wrap.classList.toggle('at-end', sw.scrollLeft + sw.clientWidth >= sw.scrollWidth - 6);
  sw.scrollLeft = _psScroll; upd();
  const act = sw.querySelector('.prod-btn.active');
  if(act){ const l = act.offsetLeft, r = l + act.offsetWidth;
    if(l < sw.scrollLeft + 8) sw.scrollLeft = Math.max(0, l - 16);
    else if(r > sw.scrollLeft + sw.clientWidth - 8) sw.scrollLeft = r - sw.clientWidth + 16; }
  _psScroll = sw.scrollLeft; upd();
  sw.addEventListener('scroll', () => { _psScroll = sw.scrollLeft; upd(); }, {passive:true});
}

function openNewOrderModal(){
  state.modal = { type:'new-order', step:1,
    data:{ personType:'student', grade:'all', personId:null, personName:null, qty:1, paid:false, search:'' } };
  render();
}
function openOrderActions(orderId){ state.modal = { type:'order-actions', orderId }; render(); }
function openConfirmDelete(orderId){ state.modal = { type:'confirm-delete', orderId }; render(); }
function closeModal(){ state.modal = null; render(); }

function renderModal(){
  let overlay = document.getElementById('modal-overlay');
  if(!state.modal){ if(overlay) overlay.remove(); return; }
  let html = '';
  if(state.modal.type === 'new-order') html = renderNewOrderSheet();
  else if(state.modal.type === 'order-actions') html = renderOrderActionsSheet();
  else if(state.modal.type === 'confirm-delete') html = renderConfirmDeleteSheet();

  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'modal-overlay'; overlay.className = 'modal-overlay';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = html;
  requestAnimationFrame(()=> overlay.classList.add('show'));
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };

  overlay.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', handleAction));
  const searchInput = overlay.querySelector('#person-search');
  if(searchInput){
    searchInput.addEventListener('input', (e) => {
      state.modal.data.search = e.target.value;
      const grid = document.getElementById('person-grid');
      if(grid){
        grid.innerHTML = renderPersonGrid();
        grid.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', handleAction));
      }
    });
  }
}

function normTxt(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function renderPersonGrid(){
  const d = state.modal.data;
  const search = normTxt(d.search);
  const mkStu = (g) => (NAS_DATA.students[g] || []).map(s => ({id:s.id, name:s.name, type:'student', grade:g}));
  const mkTea = () => NAS_DATA.teachers.map(t => ({id:t.id, name:t.name, type:'teacher'}));
  const everyone = () => GRADES.flatMap(mkStu).concat(mkTea());
  const words = search ? search.split(/\s+/) : [];
  const hit = (p) => { const n = normTxt(p.name); return words.every(w => n.includes(w)); };
  const scoped = d.personType === 'teacher' ? mkTea() : (d.grade === 'all' ? everyone() : mkStu(d.grade));
  const pool = search ? scoped.filter(hit) : scoped;   // solo dentro del curso marcado (o en Todos)
  if(!pool.length) return `<div class="empty-state" style="grid-column:1/-1;"><p>Sin resultados${d.personType==='student' && d.grade!=='all' ? ' en ' + GRADE_LABELS[d.grade] : ''}</p></div>`;
  const showCourse = (d.personType==='student' && d.grade==='all');
  return pool.map(p => `
    <div class="person-card ${p.type==='teacher'?'teacher':''} ${d.personId===p.id?'selected':''}" data-act="select-person" data-id="${p.id}" data-name="${esc(p.name)}" data-ptype="${p.type}" data-grade="${p.grade||''}">
      <div class="person-avatar">${initials(p.name)}</div>
      <div class="person-name">${esc(p.name)}</div>
      ${showCourse ? `<div class="person-course">${p.type==='teacher'?'Docente':GRADE_LABELS[p.grade]}</div>` : ''}
    </div>`).join('');
}

            <button data-act="edit-qty" data-id="${o.id}" data-delta="1" aria-label="Agregar una unidad">+</button>
          </div>
        </div>
        ${(PRODUCTS[o.product||'slushie']||{}).aguaIncl ? `
        <div class="action-item sinagua">
          <span style="font-size:22px;line-height:1">🍎</span><span>Sin aguita (se acabó)<small style="display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px;">${sinAguaOf(o)>0 ? 'Cobrar ' + formatCOP(orderTotal(o)) + ' · descuento ' + formatCOP(sinAguaOf(o)*AGUA_PRICE) : 'Cobrar ' + formatCOP(orderTotal(o)) + ' (completo)'}</small></span>
          <div class="mini-stepper">
            <button data-act="edit-sinagua" data-id="${o.id}" data-delta="-1" aria-label="Una unidad menos sin aguita">−</button>
            <span class="mv">${sinAguaOf(o)}</span>
            <button data-act="edit-sinagua" data-id="${o.id}" data-delta="1" aria-label="Una unidad más sin aguita">+</button>
          </div>
        </div>` : ''}
        ${o.paid ? '' : `
        <div class="action-item abono">
          ${ICONS.money}<span>Abono<small style="display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px;">Total ${formatCOP(orderTotal(o))} · ${abonoOf(o)>0 ? 'abonó ' + formatCOP(abonoOf(o)) + ' · debe ' + formatCOP(owedOf(o)) : 'no ha abonado'}</small></span>
          <input id="abono-input" type="number" inputmode="numeric" min="0" step="500" value="${abonoOf(o)||''}" placeholder="$ abonó" style="width:92px;font-size:17px;font-weight:800;padding:8px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--title);">
          <button data-act="save-abono" data-id="${o.id}" style="min-height:44px;padding:0 14px;border-radius:12px;border:none;background:var(--navy);color:#fff;font-weight:800;font-size:15px;">Guardar</button>
        </div>`}
        <button class="action-item ${o.paid?'':'green'}" data-act="toggle-paid" data-id="${o.id}">
          ${o.paid ? ICONS.undo : ICONS.money}
          <span>${o.paid ? 'Marcar como no pagado (debe)' : 'Confirmar pago'}</span>
        </button>
        <button class="action-item ${o.delivered?'':'green'}" data-act="${o.delivered?'undo-delivered':'mark-delivered'}" data-id="${o.id}">
          ${o.delivered ? ICONS.undo : ICONS.check}
          <span>${o.delivered ? 'Deshacer entrega' : 'Marcar como entregado'}</span>
        </button>
        <button class="action-item danger" data-act="ask-delete" data-id="${o.id}">
          ${ICONS.trash}<span>Eliminar pedido</span>
        </button>
      </div>
    </div>
  </div>`;
}

  const name = o ? esc(o.personName) : 'este pedido';

      <button class="primary-btn danger" data-act="confirm-delete" data-id="${state.modal.orderId}">${ICONS.trash} Sí, eliminar</button>
      <button class="secondary-btn" data-act="close-modal">Cancelar</button>

// ============ TOAST ============
function showToast(msg, icon){
  const t = document.getElementById('toast');
  t.innerHTML = (icon || '') + '<span>' + esc(msg) + '</span>';
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 1900);
}

// ============ EVENTS ============
function attachEvents(){
  app.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', handleAction));
}

function handleAction(e){
  const el = e.currentTarget;
  const act = el.dataset.act;

  if(act === 'nav'){ state.view = el.dataset.view; render(); }
  else if(act === 'prev-month'){ state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;} render(); }
  else if(act === 'next-month'){ state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;} render(); }
  else if(act === 'back-to-cal'){ state.view = 'calendar'; state.pickProduct = false; render(); }
  else if(act === 'new-order'){ openNewOrderModal(); }
  else if(act === 'toggle-pick'){ state.pickProduct = !state.pickProduct; render(); }
  else if(act === 'add-for-product'){ state.activeProduct = el.dataset.p; state.pickProduct = false; openNewOrderModal(); }
  else if(act === 'close-modal'){ closeModal(); }
  else if(act === 'filter'){ state.listFilter = el.dataset.f; render(); }
  else if(act === 'set-product'){ state.activeProduct = el.dataset.p; render(); }
  else if(act === 'deliver-scope'){ state.deliverScope = el.dataset.s; render(); }
  else if(act === 'stats-prev-month'){ state.statsMonth--; if(state.statsMonth<0){state.statsMonth=11; state.statsYear--;} render(); }
  else if(act === 'stats-next-month'){ state.statsMonth++; if(state.statsMonth>11){state.statsMonth=0; state.statsYear++;} render(); }
  else if(act === 'open-order'){ openOrderActions(el.dataset.id); }
  else if(act === 'ask-delete'){ openConfirmDelete(el.dataset.id); }
  else if(act === 'confirm-delete'){ deleteOrderById(el.dataset.id); closeModal(); showToast('Pedido eliminado', ICONS.trash); }

  else if(act === 'toggle-paid'){   // desde la hoja del pedido (cierra la hoja)
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.paid = !o.paid; o.paidAt = o.paid ? Date.now() : null;
    upsertOrder(o); closeModal();
    showToast(o.paid ? 'Pago confirmado' : 'Marcado como debe', o.paid?ICONS.money:ICONS.clock);
  }
  else if(act === 'mark-delivered'){   // desde la hoja del pedido
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.delivered = true; o.deliveredAt = Date.now();
    upsertOrder(o); closeModal();
    showToast('¡Entregado! ✓', ICONS.check);
  }
  else if(act === 'undo-delivered'){
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.delivered = false; o.deliveredAt = null;
    upsertOrder(o); closeModal(); showToast('Entrega deshecha', ICONS.undo);
  }
  else if(act === 'chk-delivered'){   // casilla/etiqueta de entrega tocable (todas las vistas)
    if(e.stopPropagation) e.stopPropagation();   // no abrir la ficha del pedido
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.delivered = !o.delivered; o.deliveredAt = o.delivered ? Date.now() : null;
    upsertOrder(o);
    showToast(o.delivered ? 'Entregado ✓' : 'Entrega deshecha', o.delivered?ICONS.check:ICONS.undo);
  }
  else if(act === 'chk-paid'){   // etiqueta de pago tocable (todas las vistas)
    if(e.stopPropagation) e.stopPropagation();   // no abrir la ficha del pedido
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.paid = !o.paid; o.paidAt = o.paid ? Date.now() : null;
    upsertOrder(o);
    showToast(o.paid ? 'Pago confirmado ✓' : 'Marcado como debe', o.paid?ICONS.money:ICONS.clock);
  }
  else if(act === 'save-abono'){
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    const inp = document.getElementById('abono-input');
    const v = Math.max(0, Math.round(parseFloat(inp && inp.value || '0') || 0));
    o.abono = Math.min(v, orderTotal(o)); o.abonoAt = Date.now();
    if(o.abono >= orderTotal(o)){ o.paid = true; o.paidAt = Date.now(); }   // abonó todo = pagado
    upsertOrder(o);
    openOrderActions(o.id);
  }
  else if(act === 'edit-sinagua'){
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.sinAgua = Math.max(0, Math.min(o.qty, sinAguaOf(o) + parseInt(el.dataset.delta, 10)));
    upsertOrder(o);
    openOrderActions(o.id);
  }
  else if(act === 'edit-qty'){
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    const delta = parseInt(el.dataset.delta, 10);
    o.qty = Math.max(1, Math.min(99, o.qty + delta)); if(o.sinAgua > o.qty) o.sinAgua = o.qty;
    upsertOrder(o); // vuelve a renderizar; reabrimos la hoja para reflejar el cambio
    openOrderActions(o.id);
  }

  // ---- new-order flow ----
  else if(act === 'set-persontype'){
    const d = state.modal.data; d.personType = el.dataset.type; d.personId=null; d.personName=null; d.search=''; renderModal();
  }
  else if(act === 'set-grade'){
    const d = state.modal.data; d.grade = el.dataset.grade; d.personId=null; d.personName=null; renderModal();
  }
  else if(act === 'select-person'){
    const d = state.modal.data; d.personId = el.dataset.id; d.personName = el.dataset.name; d.personType = el.dataset.ptype; if(el.dataset.grade) d.grade = el.dataset.grade; renderModal();
  }
  else if(act === 'qty-inc'){ state.modal.data.qty = Math.min(99, state.modal.data.qty+1); renderModal(); }
  else if(act === 'qty-dec'){ state.modal.data.qty = Math.max(1, state.modal.data.qty-1); renderModal(); }
  else if(act === 'qty-set'){ state.modal.data.qty = parseInt(el.dataset.n,10); renderModal(); }
  else if(act === 'set-paid'){ state.modal.data.paid = el.dataset.val === 'true'; renderModal(); }
  else if(act === 'next-step'){
    if(state.modal.step===1 && !state.modal.data.personId) return;
    state.modal.step++; renderModal();
  }
  else if(act === 'prev-step'){ state.modal.step--; renderModal(); }
  else if(act === 'save-order'){
    const d = state.modal.data;
    const now = Date.now();
    upsertOrder({
      id: uid(), date: state.selectedDate, product: state.activeProduct,
      personId: d.personId, personName: d.personName, personType: d.personType,
      grade: d.personType === 'student' ? d.grade : null,
      qty: d.qty, paid: !!d.paid, paidAt: d.paid ? now : null,
      delivered: false, deliveredAt: null, createdAt: now,
    });
    closeModal();
    showToast('Pedido guardado', ICONS.check);
  }
}

// calendar day click (delegated once on persistent #app)
app.addEventListener('click', (e) => {
  const dayEl = e.target.closest('.cal-day[data-date]');

// ============ LOCK / PIN ============
const PIN_KEY = 'nas_granizados_pin_ok';
function pinEnabled(){ return typeof APP_PIN !== 'undefined' && APP_PIN !== null && String(APP_PIN).length > 0; }
// El dispositivo recuerda el PIN para siempre (localStorage + cookie de 5 años + almacenamiento persistente)
function _pinCookie(){ return document.cookie.split('; ').some(c => c === PIN_KEY + '=' + encodeURIComponent(String(APP_PIN))); }
function isUnlocked(){
  if(!pinEnabled()) return true;
  let ok = false;
  try { ok = localStorage.getItem(PIN_KEY) === String(APP_PIN); } catch(e){}
  if(!ok && _pinCookie()){ ok = true; try { localStorage.setItem(PIN_KEY, String(APP_PIN)); } catch(e){} }
  return ok;
}
function rememberPin(){
  try { localStorage.setItem(PIN_KEY, String(APP_PIN)); } catch(e){}
  try { document.cookie = PIN_KEY + '=' + encodeURIComponent(String(APP_PIN)) + '; max-age=157680000; path=/; SameSite=Lax'; } catch(e){}
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
}

let _pinBuf = '';
function renderLock(){
  const len = String(APP_PIN).length;
  const dots = Array.from({length:len}, (_,i)=>`<div class="pin-dot" data-i="${i}"></div>`).join('');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'].map(k => {
    if(k==='') return `<div class="key blank"></div>`;
    if(k==='del') return `<button class="key del" data-key="del" aria-label="Borrar">${ICONS.backspace}</button>`;
    return `<button class="key" data-key="${k}" aria-label="${k}">${k}</button>`;
  }).join('');
  const lock = document.createElement('div');
  lock.className = 'lock'; lock.id = 'lock';
  lock.innerHTML = `
    <img src="logo-munchies.png" class="lock-logo" alt="Munchies" onerror="this.style.display='none'">
    <div class="pin-dots">${dots}</div>
    <div class="keypad">${keys}</div>
    <div class="lk-err" id="lk-err" role="alert"></div>
    <div class="lock-ver">Versión ${APP_VERSION} · ${APP_UPDATED}</div>`;
  document.body.appendChild(lock);
  lock.querySelectorAll('[data-key]').forEach(b => b.addEventListener('click', () => pinPress(b.dataset.key)));
}
function pinUpdateDots(){
  document.querySelectorAll('#lock .pin-dot').forEach((d,i) => d.classList.toggle('filled', i < _pinBuf.length));
}
function pinPress(k){
  const lock = document.getElementById('lock'); if(!lock) return;
  document.getElementById('lk-err').textContent = '';
  if(k === 'del'){ _pinBuf = _pinBuf.slice(0,-1); pinUpdateDots(); return; }
  if(_pinBuf.length >= String(APP_PIN).length) return;
  _pinBuf += k; pinUpdateDots();
  if(_pinBuf.length === String(APP_PIN).length){
    if(_pinBuf === String(APP_PIN)){
      rememberPin();
      lock.style.transition = 'opacity 0.25s'; lock.style.opacity = '0';
      setTimeout(() => { lock.remove(); boot(); }, 250);
    } else {
      lock.classList.add('error');
      document.getElementById('lk-err').textContent = 'PIN incorrecto, intenta de nuevo';
      setTimeout(() => { lock.classList.remove('error'); _pinBuf = ''; pinUpdateDots(); }, 450);
    }
  }
}

// ============ ACTUALIZACIÓN AUTOMÁTICA ============
// Compara la versión de esta app con version.json (siempre sin caché). Si hay una nueva,
// borra cachés y service worker y recarga sola. Se revisa al abrir, al volver a la app y cada 30 s.
let _updBusy = false;
async function checkForUpdate(){
  if(_updBusy) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if(!r.ok) return;
    const remote = String((await r.json()).v || '');
    if(!remote || remote === APP_VERSION) { try{ sessionStorage.removeItem('upd_try'); }catch(e){} return; }
    if(state.modal) return;                       // no interrumpe un pedido a medias
    let tries = 0; try { tries = parseInt(sessionStorage.getItem('upd_try')||'0',10); } catch(e){}
    if(tries >= 3) return;                        // evita bucles si algo sigue en caché
    try { sessionStorage.setItem('upd_try', String(tries+1)); } catch(e){}
    _updBusy = true;
    showUpdateToast('Actualizando a la versión ' + remote + '…');
    try {
      if('serviceWorker' in navigator){ const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(g => g.unregister())); }
      if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
    } catch(e){}
    location.replace(location.pathname + '?v=' + remote + '&t=' + Date.now());
  } catch(e){}
}
function showUpdateToast(msg){
  let t = document.getElementById('upd-toast');
  if(!t){ t = document.createElement('div'); t.id = 'upd-toast';
    t.style.cssText = 'position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:99999;background:#1B3A6B;color:#fff;font-weight:800;font-size:14px;padding:10px 18px;border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.35);border:2px solid #F5C842;';
    document.body.appendChild(t); }
  t.textContent = msg;
}
// ---- Jalar hacia abajo para actualizar (como en otras apps) ----
async function forceRefresh(){
  _updBusy = true;
  showUpdateToast('Actualizando…');
  try {
    if('serviceWorker' in navigator){ const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(g => g.unregister())); }
    if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  } catch(e){}
  location.replace(location.pathname + '?r=' + Date.now());
}
(function setupPullToRefresh(){
  const TRIGGER = 70;                          // píxeles que hay que jalar para activar
  let startY = null, dy = 0, active = false;
  const ind = document.createElement('div');
  ind.id = 'ptr';
  ind.style.cssText = 'position:fixed;left:50%;top:0;z-index:99998;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:#1B3A6B;color:#F5C842;border:2px solid #F5C842;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,.35);transform:translateY(-70px);opacity:0;pointer-events:none;transition:none;';
  ind.textContent = '↓';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(ind));
  if(document.body) document.body.appendChild(ind);
  const topY = () => (window.scrollY || document.documentElement.scrollTop || 0);
  const blocked = () => !!(state && state.modal) || !!document.getElementById('lock');
  document.addEventListener('touchstart', (e) => {
    if(e.touches.length !== 1 || topY() > 0 || blocked() || _updBusy){ startY = null; return; }
    startY = e.touches[0].clientY; dy = 0; active = false;
  }, {passive:true});
  document.addEventListener('touchmove', (e) => {
    if(startY === null) return;
    dy = e.touches[0].clientY - startY;
    if(dy > 6 && topY() <= 0){
      active = true;
      if(e.cancelable) e.preventDefault();      // evita el rebote nativo mientras se jala
      const pull = Math.min(dy * 0.55, 90);
      ind.style.transition = 'none';
      ind.style.opacity = String(Math.min(pull / 40, 1));
      ind.style.transform = 'translateY(' + (pull - 10 + 12) + 'px) rotate(' + (dy > TRIGGER*1.6 ? 180 : 0) + 'deg)';
      ind.textContent = dy > TRIGGER*1.6 ? '↑' : '↓';
    } else if(active && dy <= 0){ active = false; ind.style.opacity = '0'; }
  }, {passive:false});
  document.addEventListener('touchend', () => {
    if(startY === null) return;
    const go = active && dy > TRIGGER*1.6;
    startY = null;
    if(go){
      ind.style.transition = 'transform .15s'; ind.style.transform = 'translateY(54px)'; ind.style.opacity = '1'; ind.textContent = '⟳';
      ind.animate([{rotate:'0deg'},{rotate:'360deg'}], {duration:700, iterations:Infinity});
      forceRefresh();
    } else {
      ind.style.transition = 'transform .2s, opacity .2s'; ind.style.transform = 'translateY(-70px)'; ind.style.opacity = '0';
    }
    active = false;
  }, {passive:true});
})();

document.addEventListener('visibilitychange', () => { if(!document.hidden) checkForUpdate(); });
window.addEventListener('focus', checkForUpdate);
window.addEventListener('pageshow', checkForUpdate);
window.addEventListener('online', checkForUpdate);
setInterval(checkForUpdate, 20000);
checkForUpdate();

// ============ INIT ============
loadLocal();

function boot(){
  render();
  initCloud();
  if('serviceWorker' in navigator){
    // Recarga automática cuando entra en control una versión nueva de la app.
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(refreshing) return; refreshing = true; location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        // Revisa si hay versión nueva al abrir, al volver a la app y cada 60s.
        reg.update();
        document.addEventListener('visibilitychange', () => { if(!document.hidden) reg.update(); });
        setInterval(() => reg.update(), 60000);
      }).catch(()=>{});
    });
  }
}

if(isUnlocked()) boot();
else renderLock();
</script>
