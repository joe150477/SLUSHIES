<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Snacks</title>
<meta name="apple-mobile-web-app-title" content="Snacks">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e2a52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --navy:#0e2a52; --navy-deep:#081a36; --navy-light:#1c3f74;
  --red:#a31e22; --red-deep:#7a1418;
  --gold:#c8a24a; --gold-light:#e0c47e;
  --cream:#f7f3ea; --ink:#1a1a1a;
  --pending:#c2701a; --pending-bg:#fbeedd;
  --ready:#215d9c;   --ready-bg:#e6effb;
  --delivered:#2f7d4f; --delivered-bg:#e3f3e9;
  /* Colores de estado (semáforo, claros y distintos) */
  --pay-ok:#1f7a43;   --pay-ok-bg:#e2f4e9;      /* Pagado / Completo  = verde */
  --pay-debe:#c62026; --pay-debe-bg:#fce3e4;    /* Debe (falta pago)  = rojo  */
  --del-done:#1f5fa6; --del-done-bg:#e6effb;    /* Entregado          = azul  */
  --del-wait:#b3801a; --del-wait-bg:#fbf1d9;    /* Por entregar       = ámbar */
  --dot-debe:#e0524f; --dot-wait:#eaa63c; --dot-done:#4fbf7f;
  --shadow: 0 8px 24px rgba(14,42,82,0.16);
  --shadow-sm: 0 2px 8px rgba(14,42,82,0.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family: -apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
  background: var(--cream); color: var(--ink);
  overscroll-behavior-y: none; min-height:100vh; -webkit-font-smoothing:antialiased;
}
#app{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--cream); position:relative; padding-bottom:94px; }

/* ---- Sync banner ---- */
.sync-banner{max-width:480px; margin:0 auto; background:#fff6df; color:#8a6d1e; font-size:12px; font-weight:600;
  padding:8px 16px; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(200,162,74,0.3);}
.sync-banner svg{width:15px;height:15px;flex-shrink:0;}
.sync-banner.hidden{display:none;}

/* ---- Top bar ---- */
.topbar{
  background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
  color: var(--cream); padding: max(16px, env(safe-area-inset-top)) 20px 22px;
  border-radius: 0 0 28px 28px; position:relative; overflow:hidden; box-shadow:var(--shadow);
}
.topbar::after{ content:""; position:absolute; right:-30px; top:-30px; width:150px; height:150px;
  background: radial-gradient(circle, rgba(200,162,74,0.20), transparent 70%); border-radius:50%; }
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-logo{width:54px;height:54px; object-fit:contain; flex-shrink:0; display:block;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,0.32));}
.brand-text h1{font-size:19px; font-weight:800; margin:0; letter-spacing:0.2px;}
.brand-text p{font-size:11px; margin:2px 0 0; opacity:0.62; letter-spacing:0.3px;}
.sync-pill{display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); padding:6px 10px; border-radius:20px;}
.sync-pill .dot-live{width:8px;height:8px;border-radius:50%; background:#4ad07f; box-shadow:0 0 0 0 rgba(74,208,127,0.7); animation:pulse 2s infinite;}
.sync-pill.local .dot-live{background:#e0a53a; animation:none; box-shadow:none;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,208,127,0.6)}70%{box-shadow:0 0 0 7px rgba(74,208,127,0)}100%{box-shadow:0 0 0 0 rgba(74,208,127,0)}}

.summary-row{display:flex; gap:10px; margin-top:18px; position:relative;}
.summary-card{flex:1; background:rgba(255,255,255,0.07); border:1px solid rgba(200,162,74,0.25); border-radius:14px; padding:11px 12px;}
.summary-card .num{font-size:19px; font-weight:800; color:var(--gold-light); line-height:1.1;}
.summary-card .num.small{font-size:15px;}
.summary-card .lbl{font-size:10px; opacity:0.66; margin-top:3px; letter-spacing:0.2px;}

/* ---- Selector de producto ---- */
.product-switch{display:flex; gap:8px; max-width:480px; margin:0 auto; padding:12px 16px 2px;}
.prod-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:8px 10px; border-radius:14px; border:1.5px solid rgba(14,42,82,0.12); background:#fff; font-size:14px; font-weight:800; color:var(--navy-light); font-family:inherit;}
.prod-btn img{width:28px;height:28px; border-radius:8px; object-fit:cover; flex-shrink:0;}
.prod-btn.active{background:var(--navy); color:var(--gold-light); border-color:var(--navy); box-shadow:var(--shadow-sm);}
.prod-btn:active{transform:scale(0.98);}

/* ---- Calendar ---- */
.cal-wrap{padding: 18px 16px 8px;}
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 4px;}
.cal-nav button{width:36px;height:36px;border-radius:50%;border:none;background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center;}
.cal-nav button svg{width:18px;height:18px;}
.cal-nav .cal-title{font-size:16px; font-weight:800; color:var(--navy); text-transform:capitalize;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{text-align:center; font-size:11px; font-weight:700; color:var(--navy-light); opacity:0.5; padding-bottom:4px; text-transform:uppercase;}
.cal-day{aspect-ratio:1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:#fff; border:1px solid rgba(14,42,82,0.08); font-size:14px; font-weight:600; color:var(--ink); position:relative;}
.cal-day.empty{background:transparent; border:none;}
.cal-day.today{border:2px solid var(--gold);}
.cal-day.has-orders{background:var(--navy); color:#fff;}
.cal-day.festivo{background:var(--red-deep); color:rgba(255,255,255,0.5); border:1px solid rgba(122,20,24,0.3); cursor:default;}
.cal-day.festivo.has-orders{background:var(--red-deep);}
.cal-day.weekend{background:#e4e6ea; color:#aab0bb; border:1px solid rgba(14,42,82,0.05); cursor:default;}
.cal-day.weekend.has-orders{background:#e4e6ea;}
.dot-row{display:flex; gap:3px;}
.dot{width:5px;height:5px;border-radius:50%;}
.dot.pending{background:var(--dot-debe);}
.dot.ready{background:var(--dot-wait);}
.dot.delivered{background:var(--dot-done);}
.dot{width:6px;height:6px;}
.cal-legend{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:16px; padding-bottom:4px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11px; color:#888; font-weight:600;}
.legend-dot{width:9px;height:9px;border-radius:50%; display:inline-block;}
.legend-sq{width:10px;height:10px;border-radius:4px; display:inline-block;}
.legend-festivo{background:var(--red-deep);}
.legend-weekend{background:#e4e6ea; border:1px solid rgba(14,42,82,0.1);}

/* ---- Section / headers ---- */
.day-view{padding:4px 16px 20px;}
.view-title{font-size:20px; font-weight:800; color:var(--navy); margin:16px 2px 14px;}
.day-header{display:flex; align-items:center; justify-content:space-between; margin:12px 0 6px;}
.back-btn{display:flex; align-items:center; gap:6px; color:var(--navy); font-weight:700; font-size:14px; background:none; border:none; padding:6px 0;}
.back-btn svg{width:18px;height:18px;}
.day-title{font-size:18px; font-weight:800; color:var(--navy); text-transform:capitalize;}
.add-order-btn{width:100%; padding:16px; border-radius:18px; border:none; background:linear-gradient(135deg,var(--red) 0%, var(--red-deep) 100%); color:#fff; font-size:15.5px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 6px 16px rgba(163,30,34,0.3); margin-bottom:8px;}
.add-order-btn svg{width:20px;height:20px;}
.add-order-btn:active{transform:scale(0.98);}
.section-label{font-size:12px; font-weight:800; color:var(--navy-light); text-transform:uppercase; letter-spacing:0.6px; margin:20px 0 10px 2px; opacity:0.6;}

/* ---- Order card ---- */
.order-card{background:#fff; border-radius:16px; padding:13px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; border:1px solid rgba(14,42,82,0.07); box-shadow:var(--shadow-sm);}
.order-card.is-delivered{opacity:0.62;}
.order-avatar{width:44px;height:44px;border-radius:50%; flex-shrink:0; background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;}
.order-avatar.teacher{background:var(--red); color:#fff;}
.order-info{flex:1; min-width:0;}
.order-name{font-size:14.5px; font-weight:800; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.order-meta{font-size:12px; color:#8a8f98; margin-top:2px; display:flex; align-items:center; gap:6px;}
.qty-badge{font-size:12px; font-weight:800; color:var(--navy); background:var(--cream); padding:2px 8px; border-radius:9px;}
.order-right{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0;}
.status-chip{padding:5px 11px; border-radius:11px; font-size:11.5px; font-weight:800; display:flex; align-items:center; gap:4px; white-space:nowrap;}
.status-chip svg{width:12px;height:12px;}
.status-chip.pending{background:var(--pending-bg); color:var(--pending);}
.status-chip.ready{background:var(--ready-bg); color:var(--ready);}
.status-chip.delivered{background:var(--delivered-bg); color:var(--delivered);}

/* chips de estado (pago + entrega, independientes) — código de color tipo semáforo */
.chip{display:inline-flex; align-items:center; gap:4px; padding:6px 11px; border-radius:10px; font-size:11.5px; font-weight:800; white-space:nowrap; border:1px solid transparent; font-family:inherit; cursor:pointer; -webkit-appearance:none; appearance:none; line-height:1.1;}
.chip:active{transform:scale(0.93);}
.chip svg{width:12px;height:12px;}
.chip-paid{background:var(--pay-ok-bg); color:var(--pay-ok); border-color:rgba(31,122,67,0.28);}
.chip-debe{background:var(--pay-debe-bg); color:var(--pay-debe); border-color:rgba(198,32,38,0.28);}
.chip-entregado{background:var(--del-done-bg); color:var(--del-done); border-color:rgba(31,95,166,0.28);}
.chip-porentregar{background:var(--del-wait-bg); color:var(--del-wait); border-color:rgba(179,128,26,0.30);}

/* franja de color a la izquierda de la tarjeta, para escanear de un vistazo */
.order-card.acc-wait{box-shadow: inset 4px 0 0 var(--del-wait), var(--shadow-sm);}
.order-card.acc-debe{box-shadow: inset 4px 0 0 var(--pay-debe), var(--shadow-sm);}
.order-card.acc-done{box-shadow: inset 4px 0 0 var(--pay-ok), var(--shadow-sm);}
.chk-row.acc-wait{box-shadow: inset 4px 0 0 var(--del-wait), var(--shadow-sm);}
.chk-row.acc-debe{box-shadow: inset 4px 0 0 var(--pay-debe), var(--shadow-sm);}
.chk-row.acc-done{box-shadow: inset 4px 0 0 var(--pay-ok), var(--shadow-sm);}

/* ---- Delivery queue ---- */
.deliver-toggle{display:flex; gap:8px; margin:2px 0 16px;}
.deliver-toggle .filter-chip{flex:1;}
.deliver-card{background:#fff; border-radius:18px; padding:14px; margin-bottom:12px; border:1px solid rgba(14,42,82,0.08); box-shadow:var(--shadow-sm);}
.deliver-top{display:flex; align-items:center; gap:12px;}
.deliver-top .order-info .order-name{font-size:15.5px;}
.deliver-qty-big{font-size:15px; font-weight:800; color:#fff; background:var(--navy); min-width:40px; height:40px; padding:0 10px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.deliver-btn{width:100%; margin-top:12px; padding:14px; border-radius:14px; border:none; background:linear-gradient(135deg,#2f7d4f,#256b42); color:#fff; font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 5px 14px rgba(47,125,79,0.28);}
.deliver-btn svg{width:19px;height:19px;}
.deliver-btn:active{transform:scale(0.98);}
.date-group-label{font-size:12.5px; font-weight:800; color:var(--navy); text-transform:capitalize; margin:16px 2px 10px; display:flex; align-items:center; gap:8px;}
.date-group-label .pill{font-size:11px; font-weight:700; color:#fff; background:var(--gold); border-radius:20px; padding:2px 9px;}

/* checklist rápido de entrega */
.deliver-hint{font-size:12px; color:#8a8f98; line-height:1.4; margin:2px 2px 12px;}
.deliver-counts{display:flex; gap:16px; font-size:12px; font-weight:800; color:var(--navy-light); margin:0 2px 12px;}
.deliver-counts span:first-child::before{content:"●"; color:var(--del-wait); margin-right:5px;}
.deliver-counts span:last-child::before{content:"●"; color:var(--del-done); margin-right:5px;}
.chk-row{display:flex; align-items:center; gap:12px; background:#fff; border-radius:14px; padding:11px 13px; margin-bottom:9px; border:1px solid rgba(14,42,82,0.08); box-shadow:var(--shadow-sm);}
.chk-row.is-delivered{opacity:0.55;}
.chkbox{width:38px;height:38px; flex-shrink:0; border-radius:11px; border:2px solid rgba(14,42,82,0.18); background:#fff; color:#fff; display:flex; align-items:center; justify-content:center; padding:0;}
.chkbox svg{width:22px;height:22px;}
.chkbox.on{background:linear-gradient(135deg,#2f7d4f,#256b42); border-color:#256b42;}
.chk-info{flex:1; min-width:0;}
.pay-tag{flex-shrink:0; border:none; padding:8px 12px; border-radius:11px; font-size:12px; font-weight:800; white-space:nowrap;}
.pay-tag.paid{background:var(--pay-ok-bg); color:var(--pay-ok); border:1px solid rgba(31,122,67,0.3);}
.pay-tag.debe{background:var(--pay-debe-bg); color:var(--pay-debe); border:1px solid rgba(198,32,38,0.35);}

/* ---- Empty ---- */
.empty-state{text-align:center; padding:44px 20px; color:#9aa0a8;}
.empty-state .es-icon{opacity:0.28; margin-bottom:10px; display:flex; justify-content:center;}
.empty-state .es-icon svg{width:44px;height:44px;}
.empty-state p{font-size:14px; margin:0; font-weight:600;}
.empty-state .es-sub{font-size:12.5px; margin-top:4px; opacity:0.8; font-weight:500;}

/* ---- Modal / sheet ---- */
.modal-overlay{position:fixed; inset:0; background:rgba(8,20,40,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:1000; opacity:0; pointer-events:none; transition:opacity 0.25s ease;}
.modal-overlay.show{opacity:1; pointer-events:auto;}
.sheet{background:var(--cream); width:100%; max-width:480px; border-radius:28px 28px 0 0; max-height:90vh; overflow-y:auto; transform:translateY(100%); transition:transform 0.32s cubic-bezier(0.32,0.72,0,1); padding-bottom:max(20px, env(safe-area-inset-bottom));}
.modal-overlay.show .sheet{transform:translateY(0);}
.sheet-handle{width:38px; height:4px; background:rgba(14,42,82,0.18); border-radius:2px; margin:10px auto 4px;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; padding:8px 20px 12px;}
.sheet-title{font-size:17px; font-weight:800; color:var(--navy);}
.sheet-close{width:30px;height:30px;border-radius:50%; background:rgba(14,42,82,0.06); border:none; display:flex; align-items:center; justify-content:center; color:var(--navy);}
.sheet-close svg{width:16px;height:16px;}
.sheet-body{padding:4px 20px 24px;}

.step-progress{display:flex; gap:5px; padding:0 20px 14px;}
.step-progress .seg{flex:1; height:4px; border-radius:2px; background:rgba(14,42,82,0.1);}
.step-progress .seg.active{background:var(--gold);}
.step-progress .seg.done{background:var(--navy);}

.tab-row{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 14px; scrollbar-width:none;}
.tab-row::-webkit-scrollbar{display:none;}
.tab-chip{flex-shrink:0; padding:10px 18px; border-radius:14px; border:1.5px solid rgba(14,42,82,0.15); background:#fff; font-size:14px; font-weight:700; color:var(--navy-light); white-space:nowrap;}
.tab-chip.active{background:var(--navy); color:var(--gold-light); border-color:var(--navy);}
.tab-chip.teacher-chip.active{background:var(--red); color:#fff; border-color:var(--red);}

.search-input{width:100%; padding:13px 16px; border-radius:14px; border:1.5px solid rgba(14,42,82,0.1); font-size:15px; margin-bottom:14px; background:#fff;}
.search-input:focus{outline:none; border-color:var(--gold);}

.person-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.person-card{background:#fff; border-radius:16px; padding:12px 6px; text-align:center; border:1.5px solid rgba(14,42,82,0.08); display:flex; flex-direction:column; align-items:center; gap:6px;}
.person-card.selected{border-color:var(--gold); background:#fffaf0; box-shadow:0 0 0 2px rgba(200,162,74,0.25);}
.person-avatar{width:46px;height:46px;border-radius:50%; background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;}
.person-card.teacher .person-avatar{background:var(--red); color:#fff;}
.person-name{font-size:12px; font-weight:600; color:var(--ink); line-height:1.25;}

.qty-stepper{display:flex; align-items:center; justify-content:center; gap:24px; padding:22px 0 6px;}
.qty-btn{width:54px;height:54px;border-radius:50%; border:none; background:var(--navy); color:#fff; font-size:26px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.qty-btn:active{transform:scale(0.94);}
.qty-btn.minus{background:rgba(14,42,82,0.08); color:var(--navy);}
.qty-display{font-size:44px; font-weight:800; color:var(--navy); min-width:70px; text-align:center;}
.qty-sub{text-align:center; font-size:13px; color:#8a8f98; font-weight:600; margin-bottom:6px;}
.quick-qty-row{display:flex; gap:8px; justify-content:center; padding:6px 0 18px; flex-wrap:wrap;}
.quick-qty-btn{padding:8px 16px; border-radius:12px; border:1.5px solid rgba(14,42,82,0.12); background:#fff; font-size:14px; font-weight:800; color:var(--navy-light);}
.quick-qty-btn.active{background:var(--gold); border-color:var(--gold); color:var(--navy-deep);}

.confirm-summary{background:#fff; border-radius:18px; padding:16px 18px; margin-bottom:16px; border:1px solid rgba(14,42,82,0.08);}
.confirm-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:14px;}
.confirm-row .k{color:#8a8f98;}
.confirm-row .v{font-weight:800; color:var(--ink); text-align:right;}
.confirm-row .v.total{color:var(--navy); font-size:16px;}
.confirm-divider{height:1px; background:rgba(14,42,82,0.08); margin:5px 0;}

.payment-toggle{display:flex; gap:10px; margin-bottom:6px;}
.pay-option{flex:1; padding:15px 10px; border-radius:16px; border:1.5px solid rgba(14,42,82,0.1); background:#fff; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px;}
.pay-option svg{width:22px;height:22px;}
.pay-option span{font-size:13px; font-weight:800;}
.pay-option.pending-opt.active{border-color:var(--pending); background:var(--pending-bg); color:var(--pending);}
.pay-option.paid-opt.active{border-color:var(--delivered); background:var(--delivered-bg); color:var(--delivered);}
.pay-option:not(.active){color:#9aa0a8;}
.pay-hint{font-size:11.5px; color:#8a8f98; text-align:center; margin:8px 2px 4px; line-height:1.4;}

.primary-btn{width:100%; padding:16px; border-radius:16px; border:none; background:var(--navy); color:#fff; font-size:15.5px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px;}
.primary-btn svg{width:19px;height:19px;}
.primary-btn:disabled{background:rgba(14,42,82,0.2); color:rgba(255,255,255,0.6);}
.primary-btn:active:not(:disabled){transform:scale(0.98);}
.primary-btn.green{background:linear-gradient(135deg,#2f7d4f,#256b42);}
.primary-btn.danger{background:var(--red);}
.secondary-btn{width:100%; padding:14px; border-radius:16px; border:1.5px solid rgba(14,42,82,0.12); background:transparent; color:var(--navy-light); font-size:14.5px; font-weight:700; margin-top:10px;}

.person-avatar-lg{width:66px;height:66px;border-radius:50%; background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; margin:6px auto 14px;}
.action-list{display:flex; flex-direction:column; gap:8px;}
.action-item{display:flex; align-items:center; gap:12px; padding:15px 16px; border-radius:14px; background:#fff; border:1px solid rgba(14,42,82,0.08); font-size:14.5px; font-weight:700; color:var(--ink); width:100%; text-align:left;}
.action-item svg{width:20px;height:20px; flex-shrink:0; color:var(--navy);}
.action-item.danger, .action-item.danger svg{color:var(--red);}
.action-item.green, .action-item.green svg{color:var(--delivered);}
.mini-stepper{display:flex; align-items:center; gap:14px; margin-left:auto;}
.mini-stepper button{width:34px;height:34px;border-radius:50%;border:none; background:rgba(14,42,82,0.08); color:var(--navy); font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.mini-stepper .mv{font-size:17px; font-weight:800; color:var(--navy); min-width:22px; text-align:center;}

.status-track{display:flex; align-items:center; gap:0; margin:14px 0 4px; padding:0 4px;}
.track-step{flex:1; text-align:center; position:relative;}
.track-dot{width:26px;height:26px;border-radius:50%; background:rgba(14,42,82,0.1); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 5px; font-size:12px;}
.track-dot svg{width:14px;height:14px;}
.track-step.done .track-dot{background:var(--delivered);}
.track-step.current .track-dot{background:var(--gold); color:var(--navy-deep);}
.track-lbl{font-size:10.5px; font-weight:700; color:#8a8f98;}
.track-step.done .track-lbl, .track-step.current .track-lbl{color:var(--navy);}
.track-line{position:absolute; top:13px; left:50%; width:100%; height:2px; background:rgba(14,42,82,0.1); z-index:-1;}
.track-step.done .track-line{background:var(--delivered);}

/* ---- Bottom nav ---- */
.bottom-nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid rgba(14,42,82,0.08); display:flex; padding:8px 0 max(8px, env(safe-area-inset-bottom)); box-shadow:0 -4px 16px rgba(14,42,82,0.06); z-index:50;}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:#aab0b8; padding:6px 0; font-size:10.5px; font-weight:700; position:relative;}
.nav-item svg{width:22px; height:22px;}
.nav-item.active{color:var(--navy);}
.nav-badge{position:absolute; top:2px; left:calc(50% + 8px); background:var(--red); color:#fff; font-size:9.5px; font-weight:800; min-width:16px; height:16px; border-radius:10px; padding:0 4px; display:flex; align-items:center; justify-content:center;}

.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy-deep); color:#fff; padding:12px 22px; border-radius:14px; font-size:13.5px; font-weight:700; opacity:0; transition:all 0.3s ease; z-index:2000; box-shadow:var(--shadow); white-space:nowrap; display:flex; align-items:center; gap:8px;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast svg{width:16px;height:16px;}

/* ---- Stats ---- */
.sv-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
.sv-card{background:#fff; border-radius:16px; padding:15px; border:1px solid rgba(14,42,82,0.07);}
.sv-card .sv-num{font-size:22px; font-weight:800; color:var(--navy); line-height:1.1;}
.sv-card .sv-num.money{font-size:20px;}
.sv-card .sv-lbl{font-size:11.5px; color:#9aa0a8; margin-top:3px; font-weight:600;}

.list-row{display:flex; align-items:center; gap:12px; background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:8px; border:1px solid rgba(14,42,82,0.07);}
.list-row .lr-name{flex:1; font-size:14px; font-weight:700;}
.list-row .lr-val{font-size:13px; font-weight:800; color:var(--navy);}
.list-row .lr-avatar{width:36px;height:36px;border-radius:50%; background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;}
.list-row .lr-avatar.teacher{background:var(--red);}

.filter-row{display:flex; gap:7px; margin-bottom:14px;}
.filter-chip{flex:1; padding:9px 4px; border-radius:12px; border:1.5px solid rgba(14,42,82,0.12); background:#fff; font-size:12.5px; font-weight:800; color:var(--navy-light); text-align:center;}
.filter-chip.active{background:var(--navy); color:var(--gold-light); border-color:var(--navy);}

@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.rocket-anim{animation:floatY 3s ease-in-out infinite;}

/* ---- Lock / PIN screen ---- */
.lock{position:fixed; inset:0; z-index:3000; background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%); color:var(--cream);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px max(24px,env(safe-area-inset-left)) max(24px,env(safe-area-inset-bottom));}
.lock-logo{width:134px;height:134px; object-fit:contain; margin-bottom:22px; filter:drop-shadow(0 6px 16px rgba(0,0,0,0.42));}
.lock h2{font-size:21px; font-weight:800; margin:0;}
.lock .lk-sub{font-size:13px; opacity:0.6; margin:7px 0 30px;}
.pin-dots{display:flex; gap:16px; margin-bottom:34px; height:16px;}
.pin-dot{width:15px;height:15px;border-radius:50%; border:2px solid rgba(255,255,255,0.38); transition:all 0.12s;}
.pin-dot.filled{background:var(--gold-light); border-color:var(--gold-light); transform:scale(1.05);}
.lock.error .pin-dots{animation:shake 0.4s;}
.lock.error .pin-dot{border-color:#e8908f;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.keypad{display:grid; grid-template-columns:repeat(3,74px); gap:16px;}
.key{width:74px;height:74px;border-radius:50%; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.07); color:#fff; font-size:27px; font-weight:600; display:flex; align-items:center; justify-content:center; user-select:none;}
.key:active{background:rgba(255,255,255,0.22); transform:scale(0.95);}
.key.blank{background:none; border:none; pointer-events:none;}
.key.del{font-size:22px;}
.key.del svg{width:26px;height:26px;}
.lk-err{font-size:12.5px; color:#f0b4b3; font-weight:700; height:16px; margin-top:20px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<!-- Firebase (sincronización en la nube). Si no hay internet o no está configurado, la app corre en modo local. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script>
// ============ ICONS ============
const ICONS = {
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h11v9H3zM14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 13l4 4L19 7"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 18l-6-6 6-6"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v14a1 1 0 01-1 1H7a1 1 0 01-1-1V6"/></svg>',
  cone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 9h10l-3.5 11a1 1 0 01-2 0L7 9z"/><path d="M5 9c0-3 3-6 7-6s7 3 7 6"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 015 5v1"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18a4 4 0 010-8 6 6 0 0111.5-1.5A4.5 4.5 0 0118 18z"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  backspace: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 5H8L2 12l6 7h14z"/><path d="M15 9l-4 6M11 9l4 6"/></svg>',
};

// ============ STATE & PERSISTENCE ============
const APP_VERSION = '10';
const APP_UPDATED = '5 ago 2026';
const STORAGE_KEY = 'nas_granizados_orders_v2';
let orders = [];
let cloudOn = false;              // ¿estamos sincronizados con Firebase?
let db = null;

function loadLocal(){
  try { const raw = localStorage.getItem(STORAGE_KEY); orders = raw ? JSON.parse(raw) : []; }
  catch(e){ orders = []; }
}
function saveLocal(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(orders)); } catch(e){} }

function uid(){ return 'o_' + Date.now() + '_' + Math.floor(Math.random()*10000); }

// ---- Persistencia unificada (nube o local) ----
function upsertOrder(o){
  const i = orders.findIndex(x => x.id === o.id);
  if(i >= 0) orders[i] = o; else orders.push(o);
  saveLocal();
  if(cloudOn && db){ db.ref('orders/' + o.id).set(o).catch(()=>{}); }
  render();
}
function deleteOrderById(id){
  orders = orders.filter(x => x.id !== id);
  saveLocal();
  if(cloudOn && db){ db.ref('orders/' + id).remove().catch(()=>{}); }
  render();
}

// ============ FIREBASE ============
function cloudConfigured(){
  return typeof FIREBASE_CONFIG !== 'undefined'
    && FIREBASE_CONFIG.databaseURL
    && FIREBASE_CONFIG.databaseURL.indexOf('TU_') === -1
    && typeof firebase !== 'undefined';
}
function initCloud(){
  if(!cloudConfigured()) return;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    cloudOn = true;
    db.ref('orders').on('value', (snap) => {
      const val = snap.val() || {};
      orders = Object.values(val);
      saveLocal();
      render();
    }, () => { /* error de lectura: seguimos con lo local */ });
  } catch(e) { cloudOn = false; db = null; }
}

const GRADES = ['1st','2nd','3rd','4th','5th'];
const GRADE_LABELS = {'1st':'1°','2nd':'2°','3rd':'3°','4th':'4°','5th':'5°'};

function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  const a = parts[0][0] || '';
  const b = parts[1] ? parts[1][0] : '';
  return (a + b).toUpperCase();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function todayKey(){ const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }
function formatCOP(n){ return '$' + Math.round(n).toLocaleString('es-CO'); }
function personTypeLabel(o){ return o.personType === 'teacher' ? 'Docente' : (GRADE_LABELS[o.grade] + ' grado'); }

// ---- Productos (cada uno con su precio, ícono y estadísticas separadas) ----
const PRODUCTS = {
  slushie: { label:'Slushies', price: UNIT_PRICE, icon:'icons/icon-192.png', unit:'granizado', unitP:'granizados' },
  brownie: { label:'Brownies', price: (typeof BROWNIE_PRICE!=='undefined'?BROWNIE_PRICE:10000), icon:'icons/brownie-192.png', unit:'brownie', unitP:'brownies' },
};
function unitName(){ return PRODUCTS[state.activeProduct].unit; }
function unitPlural(){ return PRODUCTS[state.activeProduct].unitP; }
function unitFor(n){ return n===1 ? unitName() : unitPlural(); }
function isProd(o){ return (o.product||'slushie') === state.activeProduct; }   // producto activo
function priceOf(o){ return (PRODUCTS[o.product||'slushie']||PRODUCTS.slushie).price; }
function orderTotal(o){ return o.qty * priceOf(o); }
function activePrice(){ return PRODUCTS[state.activeProduct].price; }

const MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['D','L','M','M','J','V','S'];

const FESTIVOS_2026 = {
  '2026-01-01':'Año Nuevo','2026-01-12':'Reyes Magos','2026-03-23':'San José','2026-04-02':'Jueves Santo',
  '2026-04-03':'Viernes Santo','2026-05-01':'Día del Trabajo','2026-05-18':'Ascensión del Señor',
  '2026-06-08':'Corpus Christi','2026-06-15':'Sagrado Corazón','2026-06-29':'San Pedro y San Pablo',
  '2026-07-13':'Virgen de Chiquinquirá','2026-07-20':'Independencia','2026-08-07':'Batalla de Boyacá',
  '2026-08-17':'Asunción de la Virgen','2026-10-12':'Día de la Raza','2026-11-02':'Todos los Santos',
  '2026-11-16':'Independencia de Cartagena','2026-12-08':'Inmaculada Concepción','2026-12-25':'Navidad',
};
function isFestivo(dk){ return FESTIVOS_2026.hasOwnProperty(dk); }
function festivoName(dk){ return FESTIVOS_2026[dk] || ''; }
function isWeekend(dow){ return dow === 0 || dow === 6; }

// ---- Pago y entrega son INDEPENDIENTES (el niño puede recibir antes de pagar) ----
function isDone(o){ return o.paid && o.delivered; }
function payChip(o){
  return o.paid
    ? `<button class="chip chip-paid" data-act="chk-paid" data-id="${o.id}">${ICONS.check}Pagado</button>`
    : `<button class="chip chip-debe" data-act="chk-paid" data-id="${o.id}">${ICONS.clock}Debe</button>`;
}
function delChip(o){
  return o.delivered
    ? `<button class="chip chip-entregado" data-act="chk-delivered" data-id="${o.id}">${ICONS.check}Entregado</button>`
    : `<button class="chip chip-porentregar" data-act="chk-delivered" data-id="${o.id}">${ICONS.truck}Por entregar</button>`;
}
// Franja de color de la tarjeta según lo que falta: amber=por entregar, rojo=debe, verde=completo
function accClass(o){ return !o.delivered ? 'acc-wait' : (!o.paid ? 'acc-debe' : 'acc-done'); }

// ============ APP STATE ============
let state = {
  view: 'calendar',
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  selectedDate: null,
  modal: null,
  listFilter: 'all',
  deliverScope: 'today',
  statsYear: new Date().getFullYear(),
  statsMonth: new Date().getMonth(),
  activeProduct: 'slushie',
};

const app = document.getElementById('app');

function ordersForDate(dk){ return orders.filter(o => o.date === dk && isProd(o)); }
function dayStats(dk){
  const list = ordersForDate(dk);
  return {
    count: list.length,
    totalQty: list.reduce((s,o)=>s+o.qty,0),
    debe: list.filter(o=>!o.paid).length,
    porEntregar: list.filter(o=>!o.delivered).length,
    done: list.filter(o=>isDone(o)).length,
  };
}
// Por entregar = todo lo que aún no se ha entregado (aunque no esté pagado)
function pendingDelivery(){ return orders.filter(o => !o.delivered && isProd(o)); }
function pendingDeliveryToday(){ const tk=todayKey(); return orders.filter(o => !o.delivered && o.date===tk && isProd(o)); }

// ============ RENDER: SYNC BANNER ============
function renderSyncBanner(){
  if(cloudOn) return '';
  return `<div class="sync-banner">${ICONS.warn}
    <span>Modo local: los pedidos solo se ven en este dispositivo. Configura Firebase para sincronizar.</span></div>`;
}

// ============ RENDER: TOP BAR ============
function renderTopbar(){
  const totalToday = ordersForDate(todayKey()).reduce((s,o)=>s+o.qty,0);
  const porEntregar = pendingDeliveryToday().length;
  const porCobrar = orders.filter(o=>!o.paid && isProd(o)).reduce((s,o)=>s+orderTotal(o),0);

  return `
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <img src="logo.png" class="brand-logo rocket-anim" alt="NAS" onerror="this.style.display='none'">
        <div class="brand-text">
          <h1>Snacks</h1>
          <p>New Academy School · v${APP_VERSION}</p>
        </div>
      </div>
      <div class="sync-pill ${cloudOn?'':'local'}"><span class="dot-live"></span>${cloudOn?'En línea':'Local'}</div>
    </div>
    <div class="summary-row">
      <div class="summary-card"><div class="num">${totalToday}</div><div class="lbl">${PRODUCTS[state.activeProduct].label} hoy</div></div>
      <div class="summary-card"><div class="num">${porEntregar}</div><div class="lbl">Por entregar</div></div>
      <div class="summary-card"><div class="num small">${formatCOP(porCobrar)}</div><div class="lbl">Por cobrar</div></div>
    </div>
  </div>`;
}

// ============ RENDER: CALENDAR ============
function renderCalendar(){
  const y = state.calYear, m = state.calMonth;
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayK = todayKey();

  let cells = '';
  for(let i=0;i<firstDay;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dk = dateKey(y,m,d);
    const dow = new Date(y, m, d).getDay();
    const stats = dayStats(dk);
    const isToday = dk === todayK;
    const hasOrders = stats.count > 0;
    const festivo = isFestivo(dk);
    const weekend = isWeekend(dow) && !festivo;
    const blocked = festivo || weekend;

    let classes = 'cal-day';
    if(isToday) classes += ' today';
    if(hasOrders) classes += ' has-orders';
    if(festivo) classes += ' festivo';
    else if(weekend) classes += ' weekend';

    cells += `
      <div class="${classes}" ${blocked ? '' : `data-date="${dk}"`} ${festivo ? `title="${esc(festivoName(dk))}"` : ''}>
        <span>${d}</span>
        ${hasOrders ? `<div class="dot-row">
          ${stats.debe>0?'<div class="dot pending"></div>':''}
          ${stats.porEntregar>0?'<div class="dot ready"></div>':''}
          ${stats.done>0?'<div class="dot delivered"></div>':''}
        </div>` : ''}
      </div>`;
  }

  return `
  <div class="cal-wrap">
    <div class="cal-nav">
      <button data-act="prev-month">${ICONS.back}</button>
      <div class="cal-title">${MONTH_NAMES[m]} ${y}</div>
      <button data-act="next-month" style="transform:rotate(180deg)">${ICONS.back}</button>
    </div>
    <div class="cal-grid">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="cal-legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--dot-debe)"></span>Debe</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--dot-wait)"></span>Por entregar</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--dot-done)"></span>Completo</div>
      <div class="legend-item"><span class="legend-sq legend-festivo"></span>Festivo</div>
      <div class="legend-item"><span class="legend-sq legend-weekend"></span>Fin de semana</div>
    </div>
  </div>`;
}

// ============ RENDER: DAY ============
function orderCardHtml(o){
  return `
    <div class="order-card ${accClass(o)} ${isDone(o)?'is-delivered':''}" data-act="open-order" data-id="${o.id}">
      <div class="order-avatar ${o.personType==='teacher'?'teacher':''}">${initials(o.personName)}</div>
      <div class="order-info">
        <div class="order-name">${esc(o.personName)}</div>
        <div class="order-meta">${personTypeLabel(o)} <span class="qty-badge">×${o.qty}</span></div>
      </div>
      <div class="order-right">
        ${payChip(o)}${delChip(o)}
      </div>
    </div>`;
}
function renderDayView(){
  const dk = state.selectedDate;
  if(!dk) return '';
  const dateObj = new Date(dk + 'T00:00:00');
  const dayLabel = dateObj.toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'});
  const list = ordersForDate(dk).slice().sort((a,b)=>
    (a.delivered?1:0)-(b.delivered?1:0) || (b.createdAt||0)-(a.createdAt||0));
  const st = dayStats(dk);

  const cards = list.length ? list.map(orderCardHtml).join('') : `
    <div class="empty-state"><div class="es-icon">${ICONS.cone}</div>
      <p>Sin pedidos este día</p><div class="es-sub">Toca “Agregar pedido” para registrar el primero</div></div>`;

  return `
  <div class="day-view">
    <div class="day-header">
      <button class="back-btn" data-act="back-to-cal">${ICONS.back} Calendario</button>
    </div>
    <div class="day-title">${dayLabel}</div>
    <div style="height:14px"></div>

// ============ RENDER: DELIVERY QUEUE ============
function deliverRow(o){
  return `
    <div class="chk-row ${accClass(o)} ${isDone(o)?'is-delivered':''}">
      <button class="chkbox ${o.delivered?'on':''}" data-act="chk-delivered" data-id="${o.id}" aria-label="Entregado">${o.delivered?ICONS.check:''}</button>
      <div class="chk-info" data-act="open-order" data-id="${o.id}">
        <div class="order-name">${esc(o.personName)}</div>
        <div class="order-meta">${personTypeLabel(o)} <span class="qty-badge">×${o.qty}</span></div>
      </div>
      <button class="pay-tag ${o.paid?'paid':'debe'}" data-act="chk-paid" data-id="${o.id}">${o.paid?'Pagado':'Debe'}</button>
    </div>`;
}
function renderDeliverView(){
  const tk = todayKey();
  let q = orders.filter(isProd);
  if(state.deliverScope === 'today') q = q.filter(o => o.date === tk);
  // no entregados primero (por orden de registro), entregados abajo
  q.sort((a,b)=> (a.delivered?1:0)-(b.delivered?1:0) || a.date.localeCompare(b.date) || (a.createdAt||0)-(b.createdAt||0));

  const porEntregar = q.filter(o=>!o.delivered).length;
  const entregados = q.filter(o=>o.delivered).length;

  let content;
  if(!q.length){
    content = `<div class="empty-state"><div class="es-icon">${ICONS.truck}</div>
      <p>${state.deliverScope==='today'?'No hay pedidos hoy':'No hay pedidos'}</p>
      <div class="es-sub">Los pedidos que registre la asistente aparecen aquí para entregar.</div></div>`;
  } else if(state.deliverScope === 'all'){
    const groups = {};
    q.forEach(o => { (groups[o.date] = groups[o.date] || []).push(o); });
    content = Object.keys(groups).sort().map(dk => {
      const dObj = new Date(dk + 'T00:00:00');
      const lbl = dk===tk ? 'Hoy' : dObj.toLocaleDateString('es-CO',{weekday:'long', day:'numeric', month:'short'});
      const pend = groups[dk].filter(o=>!o.delivered).length;
      return `<div class="date-group-label">${lbl} <span class="pill">${pend} por entregar</span></div>${groups[dk].map(deliverRow).join('')}`;
    }).join('');
  } else {
    content = q.map(deliverRow).join('');
  }

  return `
  <div class="day-view">
    <div class="view-title">Entregar</div>
    <div class="deliver-hint">Marca la casilla ✓ cuando le des el ${unitName()} (aunque aún deba). Toca <b>Debe</b> cuando el papá pague.</div>
    <div class="deliver-toggle">
      <div class="filter-chip ${state.deliverScope==='today'?'active':''}" data-act="deliver-scope" data-s="today">Hoy</div>
      <div class="filter-chip ${state.deliverScope==='all'?'active':''}" data-act="deliver-scope" data-s="all">Todos</div>
    </div>
    ${q.length?`<div class="deliver-counts"><span>${porEntregar} por entregar</span><span>${entregados} entregados</span></div>`:''}
    ${content}
  </div>`;
}

// ============ RENDER: LIST ============
// Tarjeta de pedido con fecha + etiquetas tocables (reutilizable en Pedidos y Resumen)
function orderCardDated(o){
  return `
    <div class="order-card ${accClass(o)} ${isDone(o)?'is-delivered':''}" data-act="open-order" data-id="${o.id}">
      <div class="order-avatar ${o.personType==='teacher'?'teacher':''}">${initials(o.personName)}</div>
      <div class="order-info">
        <div class="order-name">${esc(o.personName)}</div>
        <div class="order-meta">${personTypeLabel(o)} · ${formatDateShort(o.date)} <span class="qty-badge">×${o.qty}</span></div>
      </div>
      <div class="order-right">${payChip(o)}${delChip(o)}</div>
    </div>`;
}
function renderListView(){
  const match = {
    all: ()=>true,
    debe: o=>!o.paid,
    porentregar: o=>!o.delivered,
    done: o=>isDone(o),
  };
  const scoped = orders.filter(isProd);
  const filtered = scoped.filter(match[state.listFilter]||match.all)
    .slice().sort((a,b) => b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));

  const counts = {
    all: scoped.length,
    debe: scoped.filter(o=>!o.paid).length,
    porentregar: scoped.filter(o=>!o.delivered).length,
    done: scoped.filter(isDone).length,
  };

  const rows = filtered.length ? filtered.map(orderCardDated).join('')
    : `<div class="empty-state"><div class="es-icon">${ICONS.list}</div><p>No hay pedidos aquí</p></div>`;

  const chip = (f,label) => `<div class="filter-chip ${state.listFilter===f?'active':''}" data-act="filter" data-f="${f}">${label}<br><span style="font-size:10px;opacity:.7">${counts[f]}</span></div>`;

  return `
  <div class="day-view">
    <div class="view-title">Todos los pedidos</div>
    <div class="filter-row">
      ${chip('all','Todos')}
      ${chip('debe','Deben')}
      ${chip('porentregar','Por entregar')}
      ${chip('done','Completos')}
    </div>
    ${rows}
  </div>`;
}
function formatDateShort(dk){
  const d = new Date(dk + 'T00:00:00');
  return d.toLocaleDateString('es-CO', {day:'numeric', month:'short'});
}

// ============ RENDER: STATS (por mes) ============
function renderStatsView(){
  const y = state.statsYear, m = state.statsMonth;
  const prefix = `${y}-${pad(m+1)}`;
  const mo = orders.filter(o => o.date.startsWith(prefix) && isProd(o));
  const sumQ = (f) => mo.filter(f).reduce((s,o)=>s+o.qty,0);
  const sumMoney = (f) => mo.filter(f).reduce((s,o)=>s+orderTotal(o),0);

  const vendidos    = sumQ(()=>true);
  const recaudado   = sumMoney(o=>o.paid);
  const porCobrar   = sumMoney(o=>!o.paid);
  const porEntregar = sumQ(o=>!o.delivered);
  const entregados  = sumQ(o=>o.delivered);

  const byDate = (a,b)=> a.date.localeCompare(b.date) || (a.createdAt||0)-(b.createdAt||0);
  const deben      = mo.filter(o=>!o.paid).sort(byDate);
  const pagoFalta  = mo.filter(o=>o.paid && !o.delivered).sort(byDate);
  const debenTotal = deben.reduce((s,o)=>s+orderTotal(o),0);
  const pLabel = PRODUCTS[state.activeProduct].label;

  return `
  <div class="day-view">
    <div class="view-title">Resumen · ${pLabel}</div>
    <div class="cal-nav" style="margin-bottom:12px;">
      <button data-act="stats-prev-month">${ICONS.back}</button>
      <div class="cal-title">${MONTH_NAMES[m]} ${y}</div>
      <button data-act="stats-next-month" style="transform:rotate(180deg)">${ICONS.back}</button>
    </div>

    <div class="section-label" style="margin-top:2px;">¿Cómo vamos este mes?</div>
    <div class="sv-grid">
      <div class="sv-card" style="border-color:rgba(31,122,67,0.28)"><div class="sv-num money" style="color:var(--pay-ok)">${formatCOP(recaudado)}</div><div class="sv-lbl">Recaudado</div></div>
      <div class="sv-card" style="border-color:rgba(198,32,38,0.28)"><div class="sv-num money" style="color:var(--pay-debe)">${formatCOP(porCobrar)}</div><div class="sv-lbl">Por cobrar</div></div>
      <div class="sv-card"><div class="sv-num">${vendidos}</div><div class="sv-lbl">${pLabel} vendidos</div></div>
      <div class="sv-card" style="border-color:rgba(179,128,26,0.28)"><div class="sv-num" style="color:var(--del-wait)">${porEntregar}</div><div class="sv-lbl">Por entregar</div></div>
    </div>

    <div class="section-label">Deben este mes${deben.length?` · ${formatCOP(debenTotal)}`:''}</div>
    ${deben.length ? deben.map(orderCardDated).join('')
      : `<div class="empty-state" style="padding:22px;"><p>Nadie debe este mes 🎉</p></div>`}

    <div class="section-label">Pagaron, falta entregar</div>
    ${pagoFalta.length ? pagoFalta.map(orderCardDated).join('')
      : `<div class="empty-state" style="padding:22px;"><p>Todo lo pagado ya se entregó ✓</p></div>`}

    <div style="text-align:center; font-size:11px; color:#aab0b8; margin:16px 0 2px;">${entregados} entregados este mes · precio ${formatCOP(activePrice())} c/u</div>
    <div style="text-align:center; font-size:11px; color:#aab0b8; margin:4px 0 2px;">Versión ${APP_VERSION} · actualizado ${APP_UPDATED}</div>
  </div>`;
}

// ============ MAIN RENDER ============
function render(){
  let body = '';
  if(state.view === 'calendar') body = renderCalendar();
  else if(state.view === 'day') body = renderDayView();
  else if(state.view === 'deliver') body = renderDeliverView();
  else if(state.view === 'list') body = renderListView();
  else if(state.view === 'stats') body = renderStatsView();

  const showTopbar = state.view === 'calendar';
  app.innerHTML = `
    ${renderSyncBanner()}
    ${showTopbar ? renderTopbar() : ''}
    ${renderProductSwitch()}

// ============ MODAL: NEW ORDER ============
function openNewOrderModal(){
  state.modal = { type:'new-order', step:1,
    data:{ personType:'student', grade:'1st', personId:null, personName:null, qty:1, paid:false, search:'' } };
  render();
}
function openOrderActions(orderId){ state.modal = { type:'order-actions', orderId }; render(); }
function openConfirmDelete(orderId){ state.modal = { type:'confirm-delete', orderId }; render(); }
function closeModal(){ state.modal = null; render(); }

function renderModal(){
  let overlay = document.getElementById('modal-overlay');
  if(!state.modal){ if(overlay) overlay.remove(); return; }
  let html = '';
  if(state.modal.type === 'new-order') html = renderNewOrderSheet();
  else if(state.modal.type === 'order-actions') html = renderOrderActionsSheet();
  else if(state.modal.type === 'confirm-delete') html = renderConfirmDeleteSheet();

  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'modal-overlay'; overlay.className = 'modal-overlay';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = html;
  requestAnimationFrame(()=> overlay.classList.add('show'));
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };

  overlay.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', handleAction));
  const searchInput = overlay.querySelector('#person-search');
  if(searchInput){
    searchInput.addEventListener('input', (e) => {
      state.modal.data.search = e.target.value;
      const grid = document.getElementById('person-grid');
      if(grid){
        grid.innerHTML = renderPersonGrid();
        grid.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', handleAction));
      }
    });
  }
}

// ============ TOAST ============
function showToast(msg, icon){
  const t = document.getElementById('toast');
  t.innerHTML = (icon || '') + '<span>' + esc(msg) + '</span>';
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 1900);
}

// ============ EVENTS ============
function attachEvents(){
  app.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', handleAction));
}

function handleAction(e){
  const el = e.currentTarget;
  const act = el.dataset.act;

  if(act === 'nav'){ state.view = el.dataset.view; render(); }
  else if(act === 'prev-month'){ state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;} render(); }
  else if(act === 'next-month'){ state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;} render(); }
  else if(act === 'back-to-cal'){ state.view = 'calendar'; render(); }
  else if(act === 'new-order'){ openNewOrderModal(); }
  else if(act === 'close-modal'){ closeModal(); }
  else if(act === 'filter'){ state.listFilter = el.dataset.f; render(); }
  else if(act === 'set-product'){ state.activeProduct = el.dataset.p; render(); }
  else if(act === 'deliver-scope'){ state.deliverScope = el.dataset.s; render(); }
  else if(act === 'stats-prev-month'){ state.statsMonth--; if(state.statsMonth<0){state.statsMonth=11; state.statsYear--;} render(); }
  else if(act === 'stats-next-month'){ state.statsMonth++; if(state.statsMonth>11){state.statsMonth=0; state.statsYear++;} render(); }
  else if(act === 'open-order'){ openOrderActions(el.dataset.id); }
  else if(act === 'ask-delete'){ openConfirmDelete(el.dataset.id); }
  else if(act === 'confirm-delete'){ deleteOrderById(el.dataset.id); closeModal(); showToast('Pedido eliminado', ICONS.trash); }

  else if(act === 'toggle-paid'){   // desde la hoja del pedido (cierra la hoja)
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.paid = !o.paid; o.paidAt = o.paid ? Date.now() : null;
    upsertOrder(o); closeModal();
    showToast(o.paid ? 'Pago confirmado' : 'Marcado como debe', o.paid?ICONS.money:ICONS.clock);
  }
  else if(act === 'mark-delivered'){   // desde la hoja del pedido
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.delivered = true; o.deliveredAt = Date.now();
    upsertOrder(o); closeModal();
    showToast('¡Entregado! ✓', ICONS.check);
  }
  else if(act === 'undo-delivered'){
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.delivered = false; o.deliveredAt = null;
    upsertOrder(o); closeModal(); showToast('Entrega deshecha', ICONS.undo);
  }
  else if(act === 'chk-delivered'){   // casilla/etiqueta de entrega tocable (todas las vistas)
    if(e.stopPropagation) e.stopPropagation();   // no abrir la ficha del pedido
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.delivered = !o.delivered; o.deliveredAt = o.delivered ? Date.now() : null;
    upsertOrder(o);
    showToast(o.delivered ? 'Entregado ✓' : 'Entrega deshecha', o.delivered?ICONS.check:ICONS.undo);
  }
  else if(act === 'chk-paid'){   // etiqueta de pago tocable (todas las vistas)
    if(e.stopPropagation) e.stopPropagation();   // no abrir la ficha del pedido
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    o.paid = !o.paid; o.paidAt = o.paid ? Date.now() : null;
    upsertOrder(o);
    showToast(o.paid ? 'Pago confirmado ✓' : 'Marcado como debe', o.paid?ICONS.money:ICONS.clock);
  }
  else if(act === 'edit-qty'){
    const o = orders.find(x => x.id === el.dataset.id); if(!o) return;
    const delta = parseInt(el.dataset.delta, 10);
    o.qty = Math.max(1, Math.min(99, o.qty + delta));
    upsertOrder(o); // vuelve a renderizar; reabrimos la hoja para reflejar el cambio
    openOrderActions(o.id);
  }

  // ---- new-order flow ----
  else if(act === 'set-persontype'){
    const d = state.modal.data; d.personType = el.dataset.type; d.personId=null; d.personName=null; d.search=''; renderModal();
  }
  else if(act === 'set-grade'){
    const d = state.modal.data; d.grade = el.dataset.grade; d.personId=null; d.personName=null; renderModal();
  }
  else if(act === 'select-person'){
    const d = state.modal.data; d.personId = el.dataset.id; d.personName = el.dataset.name; d.personType = el.dataset.ptype; renderModal();
  }
  else if(act === 'qty-inc'){ state.modal.data.qty = Math.min(99, state.modal.data.qty+1); renderModal(); }
  else if(act === 'qty-dec'){ state.modal.data.qty = Math.max(1, state.modal.data.qty-1); renderModal(); }
  else if(act === 'qty-set'){ state.modal.data.qty = parseInt(el.dataset.n,10); renderModal(); }
  else if(act === 'set-paid'){ state.modal.data.paid = el.dataset.val === 'true'; renderModal(); }
  else if(act === 'next-step'){
    if(state.modal.step===1 && !state.modal.data.personId) return;
    state.modal.step++; renderModal();
  }
  else if(act === 'prev-step'){ state.modal.step--; renderModal(); }
  else if(act === 'save-order'){
    const d = state.modal.data;
    const now = Date.now();
    upsertOrder({
      id: uid(), date: state.selectedDate, product: state.activeProduct,
      personId: d.personId, personName: d.personName, personType: d.personType,
      grade: d.personType === 'student' ? d.grade : null,
      qty: d.qty, paid: !!d.paid, paidAt: d.paid ? now : null,
      delivered: false, deliveredAt: null, createdAt: now,
    });
    closeModal();
    showToast('Pedido guardado', ICONS.check);
  }
}

// calendar day click (delegated once on persistent #app)
app.addEventListener('click', (e) => {
  const dayEl = e.target.closest('.cal-day[data-date]');
  if(dayEl){ state.selectedDate = dayEl.dataset.date; state.view = 'day'; render(); }
});

// ============ LOCK / PIN ============
const PIN_KEY = 'nas_granizados_pin_ok';
function pinEnabled(){ return typeof APP_PIN !== 'undefined' && APP_PIN !== null && String(APP_PIN).length > 0; }
function isUnlocked(){ return !pinEnabled() || localStorage.getItem(PIN_KEY) === String(APP_PIN); }

let _pinBuf = '';
function renderLock(){
  const len = String(APP_PIN).length;
  const dots = Array.from({length:len}, (_,i)=>`<div class="pin-dot" data-i="${i}"></div>`).join('');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'].map(k => {
    if(k==='') return `<div class="key blank"></div>`;
    if(k==='del') return `<button class="key del" data-key="del" aria-label="Borrar">${ICONS.backspace}</button>`;
    return `<button class="key" data-key="${k}">${k}</button>`;
  }).join('');
  const lock = document.createElement('div');
  lock.className = 'lock'; lock.id = 'lock';
  lock.innerHTML = `
    <img src="logo.png" class="lock-logo" alt="NAS" onerror="this.style.display='none'">
    <h2>Snacks</h2>
    <div class="lk-sub">Ingresa el PIN para continuar</div>
    <div class="pin-dots">${dots}</div>
    <div class="keypad">${keys}</div>
    <div class="lk-err" id="lk-err"></div>
    <div style="position:absolute; bottom:max(16px,env(safe-area-inset-bottom)); font-size:11px; opacity:0.45;">Versión ${APP_VERSION} · ${APP_UPDATED}</div>`;
  document.body.appendChild(lock);
  lock.querySelectorAll('[data-key]').forEach(b => b.addEventListener('click', () => pinPress(b.dataset.key)));
}
function pinUpdateDots(){
  document.querySelectorAll('#lock .pin-dot').forEach((d,i) => d.classList.toggle('filled', i < _pinBuf.length));
}
function pinPress(k){
  const lock = document.getElementById('lock'); if(!lock) return;
  document.getElementById('lk-err').textContent = '';
  if(k === 'del'){ _pinBuf = _pinBuf.slice(0,-1); pinUpdateDots(); return; }
  if(_pinBuf.length >= String(APP_PIN).length) return;
  _pinBuf += k; pinUpdateDots();
  if(_pinBuf.length === String(APP_PIN).length){
    if(_pinBuf === String(APP_PIN)){
      localStorage.setItem(PIN_KEY, String(APP_PIN));
      lock.style.transition = 'opacity 0.25s'; lock.style.opacity = '0';
      setTimeout(() => { lock.remove(); boot(); }, 250);
    } else {
      lock.classList.add('error');
      document.getElementById('lk-err').textContent = 'PIN incorrecto, intenta de nuevo';
      setTimeout(() => { lock.classList.remove('error'); _pinBuf = ''; pinUpdateDots(); }, 450);
    }
  }
}

// ============ INIT ============
loadLocal();

function boot(){
  render();
  initCloud();
  if('serviceWorker' in navigator){
    // Recarga automática cuando entra en control una versión nueva de la app.
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(refreshing) return; refreshing = true; location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        // Revisa si hay versión nueva al abrir, al volver a la app y cada 60s.
        reg.update();
        document.addEventListener('visibilitychange', () => { if(!document.hidden) reg.update(); });
        setInterval(() => reg.update(), 60000);
      }).catch(()=>{});
    });
  }
}

if(isUnlocked()) boot();
else renderLock();
</script>
