<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NAS Granizados</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e2a52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --navy:#0e2a52; --navy-deep:#081a36; --navy-light:#1c3f74;
  --red:#a31e22; --red-deep:#7a1418;
  --gold:#c8a24a; --gold-light:#e0c47e;
  --cream:#f7f3ea; --ink:#1a1a1a;
  --paid:#2f7d4f; --paid-bg:#e3f3e9;
  --pending:#c2701a; --pending-bg:#fbeedd;
  --shadow: 0 8px 24px rgba(14,42,82,0.16);
  --shadow-sm: 0 2px 8px rgba(14,42,82,0.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family: -apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
  background: var(--cream); color: var(--ink);
  overscroll-behavior-y: none; min-height:100vh; -webkit-font-smoothing:antialiased;
}
#app{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--cream); position:relative; padding-bottom:90px; }

.topbar{
  background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
  color: var(--cream); padding: max(18px, env(safe-area-inset-top)) 20px 22px;
  border-radius: 0 0 28px 28px; position:relative; overflow:hidden; box-shadow:var(--shadow);
}
.topbar::after{ content:""; position:absolute; right:-30px; top:-30px; width:140px; height:140px;
  background: radial-gradient(circle, rgba(200,162,74,0.18), transparent 70%); border-radius:50%; }
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.brand{display:flex; align-items:center; gap:10px;}
.crest-icon{width:36px;height:42px; flex-shrink:0;}
.brand-text h1{font-size:18px; font-weight:700; margin:0; letter-spacing:0.3px;}
.brand-text p{font-size:11px; margin:1px 0 0; opacity:0.65;}
.summary-row{display:flex; gap:10px; margin-top:18px;}
.summary-card{flex:1; background:rgba(255,255,255,0.07); border:1px solid rgba(200,162,74,0.25); border-radius:14px; padding:10px 12px;}
.summary-card .num{font-size:20px; font-weight:700; color:var(--gold-light); line-height:1.1;}
.summary-card .lbl{font-size:10.5px; opacity:0.65; margin-top:2px;}

.cal-wrap{padding: 18px 16px 8px;}
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 4px;}
.cal-nav button{width:34px;height:34px;border-radius:50%;border:none;background:var(--navy); color:var(--gold-light); font-size:16px; display:flex; align-items:center; justify-content:center;}
.cal-nav .cal-title{font-size:16px; font-weight:700; color:var(--navy); text-transform:capitalize;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{text-align:center; font-size:11px; font-weight:700; color:var(--navy-light); opacity:0.55; padding-bottom:4px; text-transform:uppercase;}
.cal-day{aspect-ratio:1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; background:#fff; border:1px solid rgba(14,42,82,0.08); font-size:14px; font-weight:600; color:var(--ink); position:relative;}
.cal-day.empty{background:transparent; border:none;}
.cal-day.today{border:2px solid var(--gold);}
.cal-day.has-orders{background:var(--navy); color:#fff;}
.cal-day.festivo{background:var(--red-deep); color:rgba(255,255,255,0.55); border:1px solid rgba(122,20,24,0.3); cursor:default;}
.cal-day.festivo.has-orders{background:var(--red-deep);}
.cal-day.weekend{background:#e4e6ea; color:#aab0bb; border:1px solid rgba(14,42,82,0.05); cursor:default;}
.cal-day.weekend.has-orders{background:#e4e6ea;}
.dot-row{display:flex; gap:3px; margin-top:1px;}
.dot{width:5px;height:5px;border-radius:50%;}
.dot.paid{background:var(--paid);}
.dot.pending{background:var(--pending);}
.cal-legend{display:flex; gap:16px; justify-content:center; margin-top:14px; padding-bottom:4px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:#888; font-weight:600;}
.legend-dot{width:10px;height:10px;border-radius:4px; display:inline-block;}
.legend-festivo{background:var(--red-deep);}
.legend-weekend{background:#e4e6ea; border:1px solid rgba(14,42,82,0.1);}

.day-view{padding:4px 16px 20px;}
.day-header{display:flex; align-items:center; justify-content:space-between; margin:10px 0 14px;}
.back-btn{display:flex; align-items:center; gap:6px; color:var(--navy); font-weight:600; font-size:14px; background:none; border:none; padding:6px 0;}
.day-title{font-size:17px; font-weight:700; color:var(--navy); text-transform:capitalize;}
.add-order-btn{width:100%; padding:16px; border-radius:18px; border:none; background:linear-gradient(135deg,var(--red) 0%, var(--red-deep) 100%); color:#fff; font-size:15.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:var(--shadow-sm); margin-bottom:18px;}
.add-order-btn:active{transform:scale(0.98);}
.section-label{font-size:12px; font-weight:700; color:var(--navy-light); text-transform:uppercase; letter-spacing:0.6px; margin:18px 0 8px 2px; opacity:0.6;}

.order-card{background:#fff; border-radius:16px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px; border:1px solid rgba(14,42,82,0.07); box-shadow:var(--shadow-sm);}
.order-avatar{width:42px;height:42px;border-radius:50%; flex-shrink:0; background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
.order-avatar.teacher{background:var(--red);}
.order-info{flex:1; min-width:0;}
.order-name{font-size:14.5px; font-weight:700; color:var(--ink);}
.order-meta{font-size:12px; color:#888; margin-top:1px;}
.order-qty{font-size:13px; font-weight:700; color:var(--navy); background:var(--cream); padding:3px 9px; border-radius:10px; flex-shrink:0;}
.order-status{flex-shrink:0; padding:6px 12px; border-radius:12px; font-size:12px; font-weight:700;}
.order-status.paid{background:var(--paid-bg); color:var(--paid);}
.order-status.pending{background:var(--pending-bg); color:var(--pending);}

.empty-state{text-align:center; padding:40px 20px; color:#999;}
.empty-state .es-icon{font-size:34px; opacity:0.3; margin-bottom:8px;}
.empty-state p{font-size:14px; margin:0;}

.modal-overlay{position:fixed; inset:0; background:rgba(8,20,40,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:1000; opacity:0; pointer-events:none; transition:opacity 0.25s ease;}
.modal-overlay.show{opacity:1; pointer-events:auto;}
.sheet{background:var(--cream); width:100%; max-width:480px; border-radius:28px 28px 0 0; max-height:88vh; overflow-y:auto; transform:translateY(100%); transition:transform 0.32s cubic-bezier(0.32,0.72,0,1); padding-bottom:max(20px, env(safe-area-inset-bottom));}
.modal-overlay.show .sheet{transform:translateY(0);}
.sheet-handle{width:36px; height:4px; background:rgba(14,42,82,0.18); border-radius:2px; margin:10px auto 4px;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; padding:8px 20px 14px;}
.sheet-title{font-size:17px; font-weight:700; color:var(--navy);}
.sheet-close{width:30px;height:30px;border-radius:50%; background:rgba(14,42,82,0.06); border:none; display:flex; align-items:center; justify-content:center; color:var(--navy); font-size:16px;}
.sheet-body{padding:4px 20px 24px;}

.step-progress{display:flex; gap:5px; padding:0 20px 14px;}
.step-progress .seg{flex:1; height:4px; border-radius:2px; background:rgba(14,42,82,0.1);}
.step-progress .seg.active{background:var(--gold);}
.step-progress .seg.done{background:var(--navy);}

.tab-row{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 14px; scrollbar-width:none;}
.tab-row::-webkit-scrollbar{display:none;}
.tab-chip{flex-shrink:0; padding:10px 18px; border-radius:14px; border:1.5px solid rgba(14,42,82,0.15); background:#fff; font-size:14px; font-weight:700; color:var(--navy-light); white-space:nowrap;}
.tab-chip.active{background:var(--navy); color:var(--gold-light); border-color:var(--navy);}
.tab-chip.teacher-chip.active{background:var(--red); color:#fff; border-color:var(--red);}

.search-input{width:100%; padding:13px 16px; border-radius:14px; border:1.5px solid rgba(14,42,82,0.1); font-size:14px; margin-bottom:14px; background:#fff;}
.search-input:focus{outline:none; border-color:var(--gold);}

.person-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.person-card{background:#fff; border-radius:16px; padding:12px 6px; text-align:center; border:1.5px solid rgba(14,42,82,0.08); display:flex; flex-direction:column; align-items:center; gap:6px;}
.person-card.selected{border-color:var(--gold); background:#fffaf0; box-shadow:0 0 0 2px rgba(200,162,74,0.25);}
.person-avatar{width:46px;height:46px;border-radius:50%; background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;}
.person-card.teacher .person-avatar{background:var(--red); color:#fff;}
.person-name{font-size:12px; font-weight:600; color:var(--ink); line-height:1.25;}

.qty-stepper{display:flex; align-items:center; justify-content:center; gap:24px; padding:24px 0 6px;}
.qty-btn{width:54px;height:54px;border-radius:50%; border:none; background:var(--navy); color:#fff; font-size:24px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.qty-btn:active{transform:scale(0.94);}
.qty-btn.minus{background:rgba(14,42,82,0.08); color:var(--navy);}
.qty-display{font-size:40px; font-weight:700; color:var(--navy); min-width:64px; text-align:center;}
.quick-qty-row{display:flex; gap:8px; justify-content:center; padding:6px 0 20px; flex-wrap:wrap;}
.quick-qty-btn{padding:8px 16px; border-radius:12px; border:1.5px solid rgba(14,42,82,0.12); background:#fff; font-size:14px; font-weight:700; color:var(--navy-light);}
.quick-qty-btn.active{background:var(--gold); border-color:var(--gold); color:var(--navy-deep);}

.confirm-summary{background:#fff; border-radius:18px; padding:18px; margin-bottom:16px; border:1px solid rgba(14,42,82,0.08);}
.confirm-row{display:flex; justify-content:space-between; padding:7px 0; font-size:14px;}
.confirm-row .k{color:#888;}
.confirm-row .v{font-weight:700; color:var(--ink);}
.confirm-divider{height:1px; background:rgba(14,42,82,0.08); margin:6px 0;}

.payment-toggle{display:flex; gap:10px; margin-bottom:20px;}
.pay-option{flex:1; padding:16px; border-radius:16px; border:1.5px solid rgba(14,42,82,0.1); background:#fff; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px;}
.pay-option span{font-size:13px; font-weight:700;}
.pay-option.pending-opt.active{border-color:var(--pending); background:var(--pending-bg); color:var(--pending);}
.pay-option.paid-opt.active{border-color:var(--paid); background:var(--paid-bg); color:var(--paid);}
.pay-option:not(.active){color:#999;}

.primary-btn{width:100%; padding:16px; border-radius:16px; border:none; background:var(--navy); color:#fff; font-size:15.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;}
.primary-btn:disabled{background:rgba(14,42,82,0.2); color:rgba(255,255,255,0.6);}
.primary-btn:active:not(:disabled){transform:scale(0.98);}
.secondary-btn{width:100%; padding:14px; border-radius:16px; border:1.5px solid rgba(14,42,82,0.12); background:transparent; color:var(--navy-light); font-size:14.5px; font-weight:600; margin-top:10px;}

.person-avatar-lg{width:64px;height:64px;border-radius:50%; background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; margin:6px auto 14px;}
.action-list{display:flex; flex-direction:column; gap:8px;}
.action-item{display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:14px; background:#fff; border:1px solid rgba(14,42,82,0.08); font-size:14.5px; font-weight:600; color:var(--ink); width:100%; text-align:left;}
.action-item.danger{color:var(--red);}

.bottom-nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid rgba(14,42,82,0.08); display:flex; padding:8px 0 max(8px, env(safe-area-inset-bottom)); box-shadow:0 -4px 16px rgba(14,42,82,0.06); z-index:50;}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:#aaa; padding:6px 0; font-size:10.5px; font-weight:600;}
.nav-item svg{width:21px; height:21px;}
.nav-item.active{color:var(--navy);}

.toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy-deep); color:#fff; padding:12px 22px; border-radius:14px; font-size:13.5px; font-weight:600; opacity:0; transition:all 0.3s ease; z-index:2000; box-shadow:var(--shadow); white-space:nowrap;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.fab{position:fixed; bottom:96px; right:max(20px, calc(50vw - 220px)); width:56px;height:56px;border-radius:50%; border:none; background:linear-gradient(135deg,var(--red),var(--red-deep)); color:#fff; font-size:26px; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; z-index:40;}
.fab:active{transform:scale(0.94);}

.view{display:none;}
.view.active{display:block;}

.sv-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
.sv-card{background:#fff; border-radius:16px; padding:16px; border:1px solid rgba(14,42,82,0.07);}
.sv-card .sv-num{font-size:24px; font-weight:700; color:var(--navy);}
.sv-card .sv-lbl{font-size:11.5px; color:#999; margin-top:2px;}

.list-row{display:flex; align-items:center; gap:12px; background:#fff; border-radius:14px; padding:13px 16px; margin-bottom:8px; border:1px solid rgba(14,42,82,0.07);}
.list-row .lr-name{flex:1; font-size:14px; font-weight:600;}
.list-row .lr-val{font-size:13px; font-weight:700; color:var(--navy);}
.list-row .lr-avatar{width:36px;height:36px;border-radius:50%; background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0;}
.list-row .lr-avatar.teacher{background:var(--red);}

.filter-row{display:flex; gap:8px; margin-bottom:14px;}
.filter-chip{flex:1; padding:9px; border-radius:12px; border:1.5px solid rgba(14,42,82,0.12); background:#fff; font-size:13px; font-weight:700; color:var(--navy-light); text-align:center;}
.filter-chip.active{background:var(--navy); color:var(--gold-light); border-color:var(--navy);}

@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.rocket-anim{animation:floatY 3s ease-in-out infinite;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
// ============ ICONS (inline SVG, no external deps) ============
const ICONS = {
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v14a1 1 0 01-1 1H7a1 1 0 01-1-1V6"/></svg>',
  cone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 9h10l-3.5 11a1 1 0 01-2 0L7 9z"/><path d="M5 9c0-3 3-6 7-6s7 3 7 6"/></svg>',
};

// ============ STATE & PERSISTENCE ============
const STORAGE_KEY = 'nas_granizados_orders_v1';
let orders = [];
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  orders = raw ? JSON.parse(raw) : [];
} catch(e) { orders = []; }

function saveOrders(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(orders)); } catch(e) {}
}

function uid(){ return 'o_' + Date.now() + '_' + Math.floor(Math.random()*10000); }

const GRADES = ['1st','2nd','3rd','4th','5th'];
const GRADE_LABELS = {'1st':'1°','2nd':'2°','3rd':'3°','4th':'4°','5th':'5°'};

function initials(name){
  const parts = name.trim().split(' ');
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function todayKey(){ const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }

const MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['D','L','M','M','J','V','S'];

// Festivos oficiales de Colombia 2026 (incluye el nuevo festivo de la Virgen de Chiquinquirá, 13 de julio)
const FESTIVOS_2026 = {
  '2026-01-01': 'Año Nuevo',
  '2026-01-12': 'Reyes Magos',
  '2026-03-23': 'San José',
  '2026-04-02': 'Jueves Santo',
  '2026-04-03': 'Viernes Santo',
  '2026-05-01': 'Día del Trabajo',
  '2026-05-18': 'Ascensión del Señor',
  '2026-06-08': 'Corpus Christi',
  '2026-06-15': 'Sagrado Corazón',
  '2026-06-29': 'San Pedro y San Pablo',
  '2026-07-13': 'Virgen de Chiquinquirá',
  '2026-07-20': 'Independencia',
  '2026-08-07': 'Batalla de Boyacá',
  '2026-08-17': 'Asunción de la Virgen',
  '2026-10-12': 'Día de la Raza',
  '2026-11-02': 'Todos los Santos',
  '2026-11-16': 'Independencia de Cartagena',
  '2026-12-08': 'Inmaculada Concepción',
  '2026-12-25': 'Navidad',
};

function isFestivo(dk){ return FESTIVOS_2026.hasOwnProperty(dk); }
function festivoName(dk){ return FESTIVOS_2026[dk] || ''; }
function isWeekend(dow){ return dow === 0 || dow === 6; } // 0=domingo, 6=sábado
function isDayBlocked(dk, dow){ return isFestivo(dk) || isWeekend(dow); }


// ============ APP STATE ============
let state = {
  view: 'calendar',
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  selectedDate: null,
  modal: null,
  listFilter: 'all',
};

const app = document.getElementById('app');

function ordersForDate(dk){
  return orders.filter(o => o.date === dk);
}

function dayStats(dk){
  const list = ordersForDate(dk);
  const totalQty = list.reduce((s,o) => s + o.qty, 0);
  const paid = list.filter(o => o.paid).length;
  const pending = list.filter(o => !o.paid).length;
  return { count: list.length, totalQty, paid, pending };
}

// ============ RENDER: TOP BAR ============
function renderTopbar(){
  const totalToday = ordersForDate(todayKey()).reduce((s,o)=>s+o.qty,0);
  const pendingTotal = orders.filter(o => !o.paid).length;
  const monthOrders = orders.filter(o => o.date.startsWith(`${state.calYear}-${pad(state.calMonth+1)}`));
  const monthQty = monthOrders.reduce((s,o)=>s+o.qty,0);

  return `
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <img src="crest.png" class="crest-icon rocket-anim" alt="NAS" onerror="this.style.display='none'">
        <div class="brand-text">
          <h1>NAS Granizados</h1>
          <p>New Academy School</p>
        </div>
      </div>
    </div>
    <div class="summary-row">
      <div class="summary-card"><div class="num">${totalToday}</div><div class="lbl">Hoy</div></div>
      <div class="summary-card"><div class="num">${monthQty}</div><div class="lbl">Este mes</div></div>
      <div class="summary-card"><div class="num">${pendingTotal}</div><div class="lbl">Por cobrar</div></div>
    </div>
  </div>`;
}

// ============ RENDER: CALENDAR VIEW ============
function renderCalendar(){
  const y = state.calYear, m = state.calMonth;
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayK = todayKey();

  let cells = '';
  for(let i=0;i<firstDay;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dk = dateKey(y,m,d);
    const dow = new Date(y, m, d).getDay();
    const stats = dayStats(dk);
    const isToday = dk === todayK;
    const hasOrders = stats.count > 0;
    const festivo = isFestivo(dk);
    const weekend = isWeekend(dow) && !festivo;
    const blocked = festivo || weekend;

    let classes = 'cal-day';
    if(isToday) classes += ' today';
    if(hasOrders) classes += ' has-orders';
    if(festivo) classes += ' festivo';
    else if(weekend) classes += ' weekend';

    cells += `
      <div class="${classes}" ${blocked ? '' : `data-date="${dk}"`} ${festivo ? `title="${festivoName(dk)}"` : ''}>
        <span>${d}</span>
        ${hasOrders ? `<div class="dot-row">
          ${stats.pending > 0 ? '<div class="dot pending"></div>' : ''}
          ${stats.paid > 0 ? '<div class="dot paid"></div>' : ''}
        </div>` : ''}
      </div>`;
  }

  return `
  <div class="view active" id="view-calendar">
    <div class="cal-wrap">
      <div class="cal-nav">
        <button data-act="prev-month">${ICONS.back}</button>
        <div class="cal-title">${MONTH_NAMES[m]} ${y}</div>
        <button data-act="next-month" style="transform:rotate(180deg)">${ICONS.back}</button>
      </div>
      <div class="cal-grid">
        ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      <div class="cal-legend">
        <div class="legend-item"><span class="legend-dot legend-festivo"></span>Festivo</div>
        <div class="legend-item"><span class="legend-dot legend-weekend"></span>Fin de semana</div>
      </div>
    </div>
  </div>`;
}

// ============ RENDER: DAY VIEW ============
function renderDayView(){
  const dk = state.selectedDate;
  if(!dk) return '';
  const dateObj = new Date(dk + 'T00:00:00');
  const dayLabel = dateObj.toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'});
  const list = ordersForDate(dk).slice().sort((a,b)=> (a.paid?1:0) - (b.paid?1:0));

  const cardsHtml = list.length ? list.map(o => `
    <div class="order-card" data-act="open-order" data-id="${o.id}">
      <div class="order-avatar ${o.personType==='teacher'?'teacher':''}">${initials(o.personName)}</div>
      <div class="order-info">
        <div class="order-name">${o.personName}</div>
        <div class="order-meta">${o.personType==='teacher' ? 'Docente' : GRADE_LABELS[o.grade] + ' grado'}</div>
      </div>
      <div class="order-qty">×${o.qty}</div>
      <div class="order-status ${o.paid?'paid':'pending'}">${o.paid ? 'Pagado' : 'Pendiente'}</div>
    </div>
  `).join('') : `
    <div class="empty-state">
      <div class="es-icon">${ICONS.cone}</div>
      <p>Sin pedidos este día todavía</p>
    </div>`;

  return `
  <div class="view active" id="view-day">
    <div class="day-view">
      <div class="day-header">
        <button class="back-btn" data-act="back-to-cal">${ICONS.back} Calendario</button>
      </div>
      <div class="day-title">${dayLabel}</div>
      <div style="height:14px"></div>
      <button class="add-order-btn" data-act="new-order">${ICONS.plus} Agregar pedido</button>
      <div class="section-label">Pedidos del día (${list.length})</div>
      ${cardsHtml}
    </div>
  </div>`;
}

// ============ RENDER: LIST VIEW ============
function renderListView(){
  const filtered = orders.filter(o => {
    if(state.listFilter === 'pending') return !o.paid;
    if(state.listFilter === 'paid') return o.paid;
    return true;
  }).slice().sort((a,b) => b.date.localeCompare(a.date));

  const rows = filtered.length ? filtered.map(o => `
    <div class="list-row" data-act="open-order" data-id="${o.id}">
      <div class="lr-avatar ${o.personType==='teacher'?'teacher':''}">${initials(o.personName)}</div>
      <div style="flex:1; min-width:0;">
        <div class="lr-name">${o.personName}</div>
        <div style="font-size:11.5px; color:#999; margin-top:1px;">${formatDateShort(o.date)} · ×${o.qty}</div>
      </div>
      <div class="order-status ${o.paid?'paid':'pending'}" style="font-size:11px; padding:5px 10px;">${o.paid?'Pagado':'Pendiente'}</div>
    </div>
  `).join('') : `<div class="empty-state"><div class="es-icon">${ICONS.list}</div><p>No hay pedidos aquí</p></div>`;

  return `
  <div class="view active" id="view-list">
    <div class="day-view">
      <div class="day-title" style="margin:14px 0 14px;">Todos los pedidos</div>
      <div class="filter-row">
        <div class="filter-chip ${state.listFilter==='all'?'active':''}" data-act="filter" data-f="all">Todos</div>
        <div class="filter-chip ${state.listFilter==='pending'?'active':''}" data-act="filter" data-f="pending">Pendientes</div>
        <div class="filter-chip ${state.listFilter==='paid'?'active':''}" data-act="filter" data-f="paid">Pagados</div>
      </div>
      ${rows}
    </div>
  </div>`;
}

function formatDateShort(dk){
  const d = new Date(dk + 'T00:00:00');
  return d.toLocaleDateString('es-CO', {day:'numeric', month:'short'});
}

// ============ RENDER: STATS VIEW ============
function renderStatsView(){
  const totalQty = orders.reduce((s,o)=>s+o.qty,0);
  const totalPending = orders.filter(o=>!o.paid).reduce((s,o)=>s+o.qty,0);
  const totalPaid = orders.filter(o=>o.paid).reduce((s,o)=>s+o.qty,0);
  const uniquePeople = new Set(orders.map(o=>o.personId)).size;

  const byPerson = {};
  orders.forEach(o => {
    if(!byPerson[o.personId]) byPerson[o.personId] = {name:o.personName, type:o.personType, qty:0};
    byPerson[o.personId].qty += o.qty;
  });
  const topBuyers = Object.values(byPerson).sort((a,b)=>b.qty-a.qty).slice(0,8);

  const buyersHtml = topBuyers.length ? topBuyers.map(b => `
    <div class="list-row">
      <div class="lr-avatar ${b.type==='teacher'?'teacher':''}">${initials(b.name)}</div>
      <div class="lr-name">${b.name}</div>
      <div class="lr-val">×${b.qty}</div>
    </div>
  `).join('') : `<div class="empty-state"><div class="es-icon">${ICONS.stats}</div><p>Aún no hay datos</p></div>`;

  return `
  <div class="view active" id="view-stats">
    <div class="day-view">
      <div class="day-title" style="margin:14px 0 14px;">Resumen</div>
      <div class="sv-grid">
        <div class="sv-card"><div class="sv-num">${totalQty}</div><div class="sv-lbl">Total vendidos</div></div>
        <div class="sv-card"><div class="sv-num">${uniquePeople}</div><div class="sv-lbl">Clientes distintos</div></div>
        <div class="sv-card" style="border-color:rgba(47,125,79,0.25)"><div class="sv-num" style="color:var(--paid)">${totalPaid}</div><div class="sv-lbl">Pagados</div></div>
        <div class="sv-card" style="border-color:rgba(194,112,26,0.25)"><div class="sv-num" style="color:var(--pending)">${totalPending}</div><div class="sv-lbl">Por cobrar</div></div>
      </div>
      <div class="section-label">Más pedidos</div>
      ${buyersHtml}
    </div>
  </div>`;
}

// ============ RENDER: BOTTOM NAV ============
function renderBottomNav(){
  const tabs = [
    {id:'calendar', icon:ICONS.calendar, label:'Calendario'},
    {id:'list', icon:ICONS.list, label:'Pedidos'},
    {id:'stats', icon:ICONS.stats, label:'Resumen'},
  ];
  return `
  <div class="bottom-nav">
    ${tabs.map(t => `
      <button class="nav-item ${state.view===t.id || (state.view==='day' && t.id==='calendar') ? 'active':''}" data-act="nav" data-view="${t.id}">
        ${t.icon}
        <span>${t.label}</span>
      </button>
    `).join('')}
  </div>`;
}

// ============ MAIN RENDER ============
function render(){
  let body = '';
  if(state.view === 'calendar') body = renderCalendar();
  else if(state.view === 'day') body = renderDayView();
  else if(state.view === 'list') body = renderListView();
  else if(state.view === 'stats') body = renderStatsView();

  const showTopbar = state.view === 'calendar';
  app.innerHTML = `
    ${showTopbar ? renderTopbar() : ''}
    ${body}
    ${renderBottomNav()}
  `;
  renderModal();
  attachEvents();
}

// ============ MODAL: NEW ORDER FLOW ============
function openNewOrderModal(){
  state.modal = {
    type: 'new-order',
    step: 1,
    data: { personType: 'student', grade: '1st', personId: null, personName: null, qty: 1, paid: false, search: '' }
  };
  render();
}

function openOrderActions(orderId){
  state.modal = { type: 'order-actions', orderId };
  render();
}

function closeModal(){ state.modal = null; render(); }

function renderModal(){
  let overlay = document.getElementById('modal-overlay');
  if(!state.modal){
    if(overlay) overlay.remove();
    return;
  }
  const html = state.modal.type === 'new-order' ? renderNewOrderSheet() : renderOrderActionsSheet();
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'modal-overlay';
    overlay.className = 'modal-overlay';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = html;
  requestAnimationFrame(()=> overlay.classList.add('show'));
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };

  // Re-attach listeners every time the modal content changes
  overlay.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', handleAction));
  const searchInput = overlay.querySelector('#person-search');
  if(searchInput){
    searchInput.addEventListener('input', (e) => {
      state.modal.data.search = e.target.value;
      const grid = document.getElementById('person-grid');
      if(grid){
        grid.innerHTML = renderPersonGrid();
        grid.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', handleAction));
      }
    });
  }
}

function renderNewOrderSheet(){
  const d = state.modal.data;
  const step = state.modal.step;

  let stepContent = '';
  let title = '';

  if(step === 1){
    title = '¿Quién pide?';
    const isStudent = d.personType === 'student';
    stepContent = `
      <div class="tab-row">
        <div class="tab-chip ${isStudent?'active':''}" data-act="set-persontype" data-type="student">Estudiante</div>
        <div class="tab-chip teacher-chip ${!isStudent?'active':''}" data-act="set-persontype" data-type="teacher">Docente</div>
      </div>
      ${isStudent ? `
        <div class="tab-row">
          ${GRADES.map(g => `<div class="tab-chip ${d.grade===g?'active':''}" data-act="set-grade" data-grade="${g}">${GRADE_LABELS[g]} grado</div>`).join('')}
        </div>
      `: ''}
      <input type="text" class="search-input" id="person-search" placeholder="Buscar nombre..." value="${d.search}">
      <div class="person-grid" id="person-grid">
        ${renderPersonGrid()}
      </div>
    `;
  } else if(step === 2){
    title = 'Cantidad';
    stepContent = `
      <div style="text-align:center; margin-bottom:6px;">
        <div class="person-avatar-lg" style="${d.personType==='teacher'?'background:var(--red)':''}">${initials(d.personName)}</div>
        <div style="font-weight:700; font-size:16px;">${d.personName}</div>
        <div style="font-size:12px; color:#999; margin-top:2px;">${d.personType==='teacher'?'Docente':GRADE_LABELS[d.grade]+' grado'}</div>
      </div>
      <div class="qty-stepper">
        <button class="qty-btn minus" data-act="qty-dec">−</button>
        <div class="qty-display">${d.qty}</div>
        <button class="qty-btn" data-act="qty-inc">+</button>
      </div>
      <div class="quick-qty-row">
        ${[1,2,3,4,5].map(n => `<div class="quick-qty-btn ${d.qty===n?'active':''}" data-act="qty-set" data-n="${n}">${n}</div>`).join('')}
      </div>
    `;
  } else if(step === 3){
    title = 'Confirmar';
    stepContent = `
      <div class="confirm-summary">
        <div class="confirm-row"><span class="k">Cliente</span><span class="v">${d.personName}</span></div>
        <div class="confirm-row"><span class="k">Tipo</span><span class="v">${d.personType==='teacher'?'Docente':GRADE_LABELS[d.grade]+' grado'}</span></div>
        <div class="confirm-divider"></div>
        <div class="confirm-row"><span class="k">Cantidad</span><span class="v">${d.qty} granizado${d.qty>1?'s':''}</span></div>
        <div class="confirm-divider"></div>
        <div class="confirm-row"><span class="k">Fecha</span><span class="v">${formatDateShort(state.selectedDate)}</span></div>
      </div>
      <div class="section-label" style="margin-top:0;">Estado de pago</div>
      <div class="payment-toggle">
        <div class="pay-option pending-opt ${!d.paid?'active':''}" data-act="set-paid" data-val="false">
          ${ICONS.clock}
          <span>Pendiente</span>
        </div>
        <div class="pay-option paid-opt ${d.paid?'active':''}" data-act="set-paid" data-val="true">
          ${ICONS.check}
          <span>Ya pagó</span>
        </div>
      </div>
    `;
  }

  const canAdvance = (step===1 && d.personId) || step===2 || step===3;

  return `
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">${title}</div>
      <button class="sheet-close" data-act="close-modal">${ICONS.close}</button>
    </div>
    <div class="step-progress">
      ${[1,2,3].map(s => `<div class="seg ${s<step?'done':s===step?'active':''}"></div>`).join('')}
    </div>
    <div class="sheet-body">
      ${stepContent}
      <div style="height:8px"></div>
      ${step < 3 ? `
        <button class="primary-btn" data-act="next-step" ${!canAdvance?'disabled':''}>Continuar</button>
      ` : `
        <button class="primary-btn" data-act="save-order">${ICONS.check} Guardar pedido</button>
      `}
      ${step > 1 ? `<button class="secondary-btn" data-act="prev-step">Atrás</button>` : ''}
    </div>
  </div>`;
}

function renderPersonGrid(){
  const d = state.modal.data;
  let pool = [];
  if(d.personType === 'student'){
    pool = (NAS_DATA.students[d.grade] || []).map(s => ({id:s.id, name:s.name, type:'student'}));
  } else {
    pool = NAS_DATA.teachers.map(t => ({id:t.id, name:t.name, type:'teacher'}));
  }
  const search = (d.search||'').toLowerCase().trim();
  if(search){
    pool = pool.filter(p => p.name.toLowerCase().includes(search));
  }
  if(!pool.length){
    return `<div class="empty-state" style="grid-column:1/-1;"><p>Sin resultados</p></div>`;
  }
  return pool.map(p => `
    <div class="person-card ${p.type==='teacher'?'teacher':''} ${d.personId===p.id?'selected':''}" data-act="select-person" data-id="${p.id}" data-name="${p.name}" data-ptype="${p.type}">
      <div class="person-avatar">${initials(p.name)}</div>
      <div class="person-name">${p.name}</div>
    </div>
  `).join('');
}

function renderOrderActionsSheet(){
  const o = orders.find(x => x.id === state.modal.orderId);
  if(!o) return '';
  return `
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">Pedido</div>
      <button class="sheet-close" data-act="close-modal">${ICONS.close}</button>
    </div>
    <div class="sheet-body">
      <div style="text-align:center;">
        <div class="person-avatar-lg" style="${o.personType==='teacher'?'background:var(--red)':''}">${initials(o.personName)}</div>
        <div style="font-weight:700; font-size:17px;">${o.personName}</div>
        <div style="font-size:12.5px; color:#999; margin-top:2px;">${o.personType==='teacher'?'Docente':GRADE_LABELS[o.grade]+' grado'} · ${o.qty} granizado${o.qty>1?'s':''}</div>
      </div>
      <div style="height:18px"></div>
      <div class="action-list">
        <button class="action-item" data-act="toggle-paid" data-id="${o.id}">
          ${o.paid ? ICONS.clock : ICONS.check}
          <span>${o.paid ? 'Marcar como pendiente' : 'Marcar como pagado'}</span>
        </button>
        <button class="action-item danger" data-act="delete-order" data-id="${o.id}">
          ${ICONS.trash}
          <span>Eliminar pedido</span>
        </button>
      </div>
    </div>
  </div>`;
}

// ============ TOAST ============
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 1800);
}

// ============ EVENT HANDLING ============
function attachEvents(){
  // Modal listeners are attached inside renderModal() itself, so this only
  // needs to wire up the main app view (calendar/day/list/stats).
  app.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', handleAction);
  });
}

function handleAction(e){
  const el = e.currentTarget;
  const act = el.dataset.act;

  if(act === 'nav'){
    state.view = el.dataset.view;
    render();
  }
  else if(act === 'prev-month'){
    state.calMonth--;
    if(state.calMonth < 0){ state.calMonth = 11; state.calYear--; }
    render();
  }
  else if(act === 'next-month'){
    state.calMonth++;
    if(state.calMonth > 11){ state.calMonth = 0; state.calYear++; }
    render();
  }
  else if(act === 'back-to-cal'){
    state.view = 'calendar';
    render();
  }
  else if(act === 'new-order'){
    openNewOrderModal();
  }
  else if(act === 'close-modal'){
    closeModal();
  }
  else if(act === 'filter'){
    state.listFilter = el.dataset.f;
    render();
  }
  else if(act === 'open-order'){
    openOrderActions(el.dataset.id);
  }
  else if(act === 'toggle-paid'){
    const o = orders.find(x => x.id === el.dataset.id);
    if(o){ o.paid = !o.paid; saveOrders(); }
    closeModal();
    showToast(o && o.paid ? 'Marcado como pagado ✓' : 'Marcado como pendiente');
  }
  else if(act === 'delete-order'){
    orders = orders.filter(x => x.id !== el.dataset.id);
    saveOrders();
    closeModal();
    showToast('Pedido eliminado');
  }
  else if(act === 'set-persontype'){
    state.modal.data.personType = el.dataset.type;
    state.modal.data.personId = null;
    state.modal.data.personName = null;
    state.modal.data.search = '';
    renderModal();
  }
  else if(act === 'set-grade'){
    state.modal.data.grade = el.dataset.grade;
    state.modal.data.personId = null;
    state.modal.data.personName = null;
    renderModal();
  }
  else if(act === 'select-person'){
    state.modal.data.personId = el.dataset.id;
    state.modal.data.personName = el.dataset.name;
    state.modal.data.personType = el.dataset.ptype;
    renderModal();
  }
  else if(act === 'qty-inc'){
    state.modal.data.qty = Math.min(99, state.modal.data.qty + 1);
    renderModal();
  }
  else if(act === 'qty-dec'){
    state.modal.data.qty = Math.max(1, state.modal.data.qty - 1);
    renderModal();
  }
  else if(act === 'qty-set'){
    state.modal.data.qty = parseInt(el.dataset.n, 10);
    renderModal();
  }
  else if(act === 'set-paid'){
    state.modal.data.paid = el.dataset.val === 'true';
    renderModal();
  }
  else if(act === 'next-step'){
    if(state.modal.step === 1 && !state.modal.data.personId) return;
    state.modal.step++;
    renderModal();
  }
  else if(act === 'prev-step'){
    state.modal.step--;
    renderModal();
  }
  else if(act === 'save-order'){
    const d = state.modal.data;
    orders.push({
      id: uid(),
      date: state.selectedDate,
      personId: d.personId,
      personName: d.personName,
      personType: d.personType,
      grade: d.personType === 'student' ? d.grade : null,
      qty: d.qty,
      paid: d.paid,
      createdAt: Date.now()
    });
    saveOrders();
    closeModal();
    showToast('Pedido guardado ✓');
    render();
  }
}

// calendar day click delegation
app.addEventListener('click', (e) => {
  const dayEl = e.target.closest('.cal-day[data-date]');
  if(dayEl){
    state.selectedDate = dayEl.dataset.date;
    state.view = 'day';
    render();
  }
});

// ============ INIT ============
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
