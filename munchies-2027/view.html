<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saldo Munchies</title>
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="icons/galleta-192.png">
<style>
:root{--navy:#1B3A6B;--navy-deep:#112850;--red:#C8292B;--gold:#F5C842;--green:#2D8C4E;--bg:#FFF8E6;--surface:#fff;--ink:#1b2233;--muted:#566074;--line:rgba(27,58,107,.14);--pos:#17693a;--neg:#b01e22;}
@media (prefers-color-scheme:dark){:root{--bg:#0c1426;--surface:#16213a;--ink:#eef2fb;--muted:#a8b3c9;--line:rgba(255,255,255,.14);--pos:#86e0a6;--neg:#ff9b9d;}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Rounded','Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.3}
.wrap{max-width:480px;margin:0 auto;padding-bottom:30px}
.top{background:linear-gradient(165deg,#2c5290,var(--navy) 45%,var(--navy-deep));color:#fff;text-align:center;padding:max(14px,env(safe-area-inset-top)) 16px 34px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,#fff8e6 22px 44px)}
.top img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 3px 7px rgba(0,0,0,.35))}
.top h1{margin:2px 0 0;font-size:20px;font-weight:900}
.card{margin:-18px 16px 0;position:relative;background:var(--surface);border-radius:24px;padding:20px 16px;text-align:center;box-shadow:0 10px 28px rgba(27,58,107,.18)}
.nm{font-size:30px;font-weight:900;color:var(--navy);overflow-wrap:anywhere}
@media (prefers-color-scheme:dark){.nm{color:#dce7ff}}
.cs{font-size:20px;font-weight:800;color:var(--muted);margin-top:2px}
.lb{font-size:18px;font-weight:900;color:var(--muted);letter-spacing:.8px;margin-top:16px}
.bal{font-size:64px;font-weight:900;color:var(--green);line-height:1.05;overflow-wrap:anywhere}
.upd{font-size:16px;font-weight:700;color:var(--muted);margin-top:8px}
h2{font-size:20px;font-weight:900;margin:22px 20px 8px;color:var(--navy)}
@media (prefers-color-scheme:dark){h2{color:#dce7ff}}
.mv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:0 16px;padding:12px 6px;border-bottom:1px solid var(--line);font-size:18px}
.mv .t{font-weight:800}.mv .a{font-weight:900;font-size:21px;text-align:right}
.mv .a.p{color:var(--pos)}.mv .a.n{color:var(--neg)}
.mv .d{font-size:15px;color:var(--muted);font-weight:700;grid-column:1/-1}
.msg{margin:30px 20px;text-align:center;font-size:20px;font-weight:800;color:var(--muted)}
.msg.err{color:var(--neg)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="logo-munchies.png" alt="Munchies" onerror="this.style.display='none'"><h1>Carné Munchies</h1></div>
  <div id="out"><div class="msg">Cargando…</div></div>
</div>
<script src="firebase-config.js"></script>
<script>
(function(){
  var out = document.getElementById('out');
  var token = (new URLSearchParams(location.search).get('t') || '').trim();
  var TL = {recarga:'Recarga', compra:'Compra', ajuste:'Ajuste', reverso:'Reverso'};
  var lastData = null;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n){ return '$' + Math.round(n || 0).toLocaleString('es-CO'); }
  function ago(ms){
    var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if(s < 45) return 'hace unos segundos';
    var m = Math.round(s / 60); if(m < 60) return 'hace ' + m + (m === 1 ? ' minuto' : ' minutos');
    var h = Math.round(m / 60); if(h < 24) return 'hace ' + h + (h === 1 ? ' hora' : ' horas');
    var d = Math.round(h / 24); return 'hace ' + d + (d === 1 ? ' día' : ' días');
  }
  function fdt(at){ var d = new Date(at); return d.toLocaleDateString('es-CO', {day:'numeric', month:'short'}) + ' · ' + d.toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'}); }
  function cloudOk(){ return typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.databaseURL.indexOf('TU_') === -1; }
  function load(){
    if(!/^[A-Za-z0-9_-]{24}$/.test(token)) return Promise.resolve({bad:true});
    if(cloudOk()){
      var url = FIREBASE_CONFIG.databaseURL.replace(/\/$/, '') + '/view/' + encodeURIComponent(token) + '.json';
      return fetch(url, {cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('http ' + r.status);
        return r.json();
      }).then(function(v){ return v ? {v:v} : {bad:true}; });
    }
    try { var all = JSON.parse(localStorage.getItem('munchies_view_v1') || '{}'); return Promise.resolve(all[token] ? {v:all[token]} : {bad:true}); }
    catch(e){ return Promise.resolve({bad:true}); }
  }
  function draw(){
    if(!lastData) return;
    var v = lastData.v, mv = (v.last || []).slice().sort(function(a, b){ return b.at - a.at; });
    out.innerHTML = '<div class="card"><div class="nm">' + esc(v.name) + '</div><div class="cs">' + esc(v.course || '') + '</div>' +
      '<div class="lb">SALDO</div><div class="bal">' + money(v.balance) + '</div>' +
      '<div class="upd">Actualizado ' + ago(v.updatedAt || Date.now()) + (lastData.stale ? ' · sin conexión' : '') + '</div></div>' +
      '<h2>Últimos movimientos</h2>' +
      (mv.length ? mv.map(function(t){
        var a = t.amount || 0;
        return '<div class="mv"><div class="t">' + esc(TL[t.type] || t.type) + '</div><div class="a ' + (a < 0 ? 'n' : 'p') + '">' + (a < 0 ? '−' : '+') + money(Math.abs(a)) + '</div><div class="d">' + fdt(t.at) + (t.items ? ' · ' + esc(t.items) : '') + '</div></div>';
      }).join('') : '<div class="msg">Todavía no hay movimientos.</div>');
  }
  function tick(){
    load().then(function(r){
      if(r.bad){ lastData = null; out.innerHTML = '<div class="msg err">Este enlace no es válido o el carné fue reemplazado.<br>Pide el carné nuevo en la tienda.</div>'; return; }
      lastData = r; draw();
    }).catch(function(){
      if(lastData){ lastData.stale = true; draw(); }
      else out.innerHTML = '<div class="msg err">No se pudo cargar. Revisa tu internet y vuelve a intentar.</div>';
    });
  }
  tick(); setInterval(tick, 20000); setInterval(draw, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick(); });
})();
</script>
</body>
</html>
